      function buildSmoothPath(coords) {
        if (!coords.length) return '';
        if (coords.length === 1) return `M ${coords[0][0]} ${coords[0][1]}`;
        let d = `M ${coords[0][0]} ${coords[0][1]}`;
        for (let i = 0; i < coords.length - 1; i += 1) {
          const p0 = coords[i - 1] || coords[i];
          const p1 = coords[i];
          const p2 = coords[i + 1];
          const p3 = coords[i + 2] || p2;
          const cp1x = p1[0] + (p2[0] - p0[0]) / 6;
          const cp1y = p1[1] + (p2[1] - p0[1]) / 6;
          const cp2x = p2[0] - (p3[0] - p1[0]) / 6;
          const cp2y = p2[1] - (p3[1] - p1[1]) / 6;
          d += ` C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${p2[0]} ${p2[1]}`;
        }
        return d;
      }

      function createTrendChart(points, color, valueFormatter, valueLabel) {
        const wrap = document.createElement('div');
        wrap.className = 'chartWrap';
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('viewBox', '0 0 520 180');
        svg.setAttribute('class', 'chartSvg');
        const tooltip = document.createElement('div');
        tooltip.className = 'chartTooltip';
        const values = points.map((p) => p.value || 0);
        const max = Math.max(1, ...values, 0);
        const coords = points.map((v, i) => {
          const x = points.length <= 1 ? 16 : 16 + (488 * i / (points.length - 1));
          const y = 156 - (((v.value || 0) / max) * 128);
          return [x, y];
        });
        for (let i = 0; i < 4; i += 1) {
          const y = 24 + (i * 40);
          const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
          line.setAttribute('x1', '16');
          line.setAttribute('x2', '504');
          line.setAttribute('y1', String(y));
          line.setAttribute('y2', String(y));
          line.setAttribute('stroke', '#e3e1db');
          line.setAttribute('stroke-width', '1');
          svg.appendChild(line);
        }
        if (!coords.length) {
          wrap.appendChild(svg);
          wrap.appendChild(tooltip);
          return wrap;
        }
        const area = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        const d = buildSmoothPath(coords);
        const areaPath = `${d} L ${coords[coords.length - 1][0]} 156 L ${coords[0][0]} 156 Z`;
        area.setAttribute('d', areaPath);
        area.setAttribute('fill', color);
        area.setAttribute('fill-opacity', '0.16');
        line.setAttribute('d', d);
        line.setAttribute('fill', 'none');
        line.setAttribute('stroke', color);
        line.setAttribute('stroke-width', '3');
        line.setAttribute('stroke-linecap', 'round');
        line.setAttribute('stroke-linejoin', 'round');
        svg.appendChild(area);
        svg.appendChild(line);

        const hotspot = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        hotspot.setAttribute('x', '0');
        hotspot.setAttribute('y', '0');
        hotspot.setAttribute('width', '520');
        hotspot.setAttribute('height', '180');
        hotspot.setAttribute('fill', 'transparent');
        svg.appendChild(hotspot);

        const marker = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        marker.setAttribute('r', '4');
        marker.setAttribute('fill', color);
        marker.style.display = 'none';
        svg.appendChild(marker);

        const showTip = (clientX) => {
          const rect = svg.getBoundingClientRect();
          const ratio = rect.width > 0 ? Math.max(0, Math.min(1, (clientX - rect.left) / rect.width)) : 0;
          const idx = Math.max(0, Math.min(points.length - 1, Math.round(ratio * (points.length - 1))));
          const item = points[idx];
          const [x, y] = coords[idx];
          marker.style.display = '';
          marker.setAttribute('cx', String(x));
          marker.setAttribute('cy', String(y));
          tooltip.style.display = 'block';
          tooltip.innerHTML = `<div>${valueLabel} ${valueFormatter(item.value || 0)}</div><div class="muted">${item.label}</div>`;
          const left = Math.min(rect.width - 130, Math.max(8, (x / 520) * rect.width - 20));
          const top = Math.max(8, (y / 180) * rect.height - 54);
          tooltip.style.left = `${left}px`;
          tooltip.style.top = `${top}px`;
        };

        hotspot.addEventListener('mousemove', (e) => showTip(e.clientX));
        hotspot.addEventListener('mouseenter', (e) => showTip(e.clientX));
        hotspot.addEventListener('mouseleave', () => {
          tooltip.style.display = 'none';
          marker.style.display = 'none';
        });

        wrap.appendChild(svg);
        wrap.appendChild(tooltip);
        return wrap;
      }

      function createDonutChart(items) {
        const wrap = document.createElement('div');
        wrap.className = 'donutWrap';
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('viewBox', '0 0 180 180');
        svg.setAttribute('class', 'donutSvg');
        const total = items.reduce((s, x) => s + (x.value || 0), 0);
        const colors = ['#8b8680', '#c65746', '#e0aa14', '#10b981'];
        const radius = 56;
        const circumference = 2 * Math.PI * radius;
        const ring = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        ring.setAttribute('cx', '90');
        ring.setAttribute('cy', '90');
        ring.setAttribute('r', String(radius));
        ring.setAttribute('fill', 'none');
        ring.setAttribute('stroke', '#edeae3');
        ring.setAttribute('stroke-width', '18');
        svg.appendChild(ring);
        let offset = 0;
        items.forEach((item, idx) => {
          const frac = total > 0 ? (item.value || 0) / total : 0;
          const len = Math.max(0, frac * circumference);
          const arc = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          arc.setAttribute('cx', '90');
          arc.setAttribute('cy', '90');
          arc.setAttribute('r', String(radius));
          arc.setAttribute('fill', 'none');
          arc.setAttribute('stroke', colors[idx % colors.length]);
          arc.setAttribute('stroke-width', '18');
          arc.setAttribute('stroke-linecap', 'round');
          arc.setAttribute('transform', 'rotate(-90 90 90)');
          arc.setAttribute('stroke-dasharray', `${len} ${Math.max(0, circumference - len)}`);
          arc.setAttribute('stroke-dashoffset', String(-offset));
          svg.appendChild(arc);
          offset += len;
        });
        const center1 = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        center1.setAttribute('x', '90');
        center1.setAttribute('y', '84');
        center1.setAttribute('class', 'donutCenter');
        center1.textContent = '总 Token';
        const center2 = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        center2.setAttribute('x', '90');
        center2.setAttribute('y', '104');
        center2.setAttribute('class', 'donutCenter');
        center2.style.fontSize = '18px';
        center2.style.fontWeight = '800';
        center2.style.fill = 'var(--text)';
        center2.textContent = fmtCompactTokens(total);
        svg.appendChild(center1);
        svg.appendChild(center2);
        wrap.appendChild(svg);

        const list = document.createElement('div');
        list.className = 'chartBox';
        items.forEach((item, idx) => {
          const row = document.createElement('div');
          row.className = 'miniItem';
          row.innerHTML = `<div class="k"><span class="legendDot" style="background:${colors[idx % colors.length]}"></span>${item.label}</div><div class="v">${fmtCompactTokens(item.value)}</div><div class="hint">${total > 0 ? pct((item.value / total) * 100) : '--'}</div>`;
          list.appendChild(row);
        });
        wrap.appendChild(list);
        return wrap;
      }

      function createBars(items, formatter) {
        const box = document.createElement('div');
        box.className = 'chartBox';
        const max = Math.max(1, ...items.map((x) => x.value || 0), 0);
        if (!items.length) {
          const empty = document.createElement('div');
          empty.className = 'emptyHint';
          empty.textContent = '当前窗口暂无数据';
          box.appendChild(empty);
          return box;
        }
        for (const item of items) {
          const row = document.createElement('div');
          row.style.display = 'grid';
          row.style.gap = '6px';
          row.innerHTML = `<div class="dashMeta"><span>${item.label}</span><span>${formatter(item.value)}</span></div>`;
          const track = document.createElement('div');
          track.className = 'track';
          const fill = document.createElement('div');
          fill.className = 'fill';
          fill.style.width = `${Math.max(4, Math.round((item.value / max) * 100))}%`;
          track.appendChild(fill);
          row.appendChild(track);
          box.appendChild(row);
        }
        return box;
      }

      function createHealthStrip(buckets) {
        const wrap = document.createElement('div');
        wrap.className = 'healthStrip';
        const dots = document.createElement('div');
        dots.className = 'healthDots';
        const tooltip = document.createElement('div');
        tooltip.className = 'healthTooltip';
        if (!buckets.length) {
          const empty = document.createElement('div');
          empty.className = 'emptyHint';
          empty.textContent = '当前窗口暂无健康监测数据';
          wrap.appendChild(empty);
          return wrap;
        }
        const showTip = (dot, b, cls) => {
          const rect = dot.getBoundingClientRect();
          const host = wrap.getBoundingClientRect();
          const failRate = b.req > 0 ? (b.fail / Math.max(1, b.req)) * 100 : 0;
          const label = cls === 'good' ? '健康' : cls === 'warn' ? '有失败' : cls === 'bad' ? '失败偏高' : '无请求';
          tooltip.style.display = 'block';
          tooltip.innerHTML = `<div>${label}</div><div class="muted">${fmtBucketLabel(b.ts, Math.max(5 * 60 * 1000, buckets.length > 1 ? buckets[1].ts - buckets[0].ts : 0))}</div><div class="muted">请求 ${fmtNum(b.req)} · 失败 ${fmtNum(b.fail)} · 失败率 ${pct(failRate)}</div>`;
          const dotCenter = rect.left - host.left + (rect.width / 2);
          tooltip.style.left = `${dotCenter - 75}px`;
          tooltip.style.top = `${rect.top - host.top - 66}px`;
        };
        const hideTip = () => { tooltip.style.display = 'none'; };

        buckets.forEach((b) => {
          const dot = document.createElement('button');
          dot.type = 'button';
          let cls = 'empty';
          if (b.req > 0) {
            const failRate = b.fail / Math.max(1, b.req);
            cls = failRate >= 0.5 ? 'bad' : failRate > 0 ? 'warn' : 'good';
          }
          dot.className = `healthDot ${cls}`;
          dot.onmouseenter = () => showTip(dot, b, cls);
          dot.onmousemove = () => showTip(dot, b, cls);
          dot.onmouseleave = hideTip;
          dot.onfocus = () => showTip(dot, b, cls);
          dot.onblur = hideTip;
          dots.appendChild(dot);
        });
        wrap.appendChild(dots);
        wrap.appendChild(tooltip);
        const meta = document.createElement('div');
        meta.className = 'legendRow';
        meta.innerHTML = `
          <span><i class="legendDot" style="background:#10b981"></i>健康</span>
          <span><i class="legendDot" style="background:#e0aa14"></i>有失败</span>
          <span><i class="legendDot" style="background:#c65746"></i>失败偏高</span>
          <span><i class="legendDot" style="background:#ddd7cf"></i>无请求</span>
        `;
        wrap.appendChild(meta);
        return wrap;
      }

      function createTable(headers, rows) {
        const wrap = document.createElement('div');
        wrap.className = 'scrollTable';
        const table = document.createElement('table');
        table.className = 'tableLite';
        const thead = document.createElement('thead');
        thead.innerHTML = `<tr>${headers.map((h) => `<th>${h}</th>`).join('')}</tr>`;
        table.appendChild(thead);
        const tbody = document.createElement('tbody');
        if (!rows.length) {
          const tr = document.createElement('tr');
          tr.innerHTML = `<td colspan="${headers.length}" class="emptyHint">当前窗口暂无数据</td>`;
          tbody.appendChild(tr);
        } else {
          rows.forEach((row) => {
            const tr = document.createElement('tr');
            tr.innerHTML = row.map((v) => `<td>${v}</td>`).join('');
            tbody.appendChild(tr);
          });
        }
        table.appendChild(tbody);
        wrap.appendChild(table);
        return wrap;
      }

      function renderUsageBlocks(filteredRows = null) {
        const root = $('usageBlocks');
        root.innerHTML = '';
        if (selectedStatusGroups.size === 0 || (Array.isArray(filteredRows) && filteredRows.length === 0)) {
          const empty = document.createElement('div');
          empty.className = 'dashBlock full';
          empty.innerHTML = `<div class="dashBlockTitle">N/A</div><div class="emptyHint">${selectedStatusGroups.size === 0 ? '当前没有选中任何显示组别，仪表盘暂无数据。' : '当前筛选结果为 0 个账号，仪表盘暂无数据。'}</div>`;
          root.appendChild(empty);
          return;
        }
        if (state.loadingUsage && state.usageDetails.length === 0) {
          const loading = document.createElement('div');
          loading.className = 'dashBlock full';
          loading.innerHTML = '<div class="dashBlockTitle">统计刷新中</div><div class="emptyHint">账号列表已更新，正在后台加载 usage 明细...</div>';
          root.appendChild(loading);
          return;
        }
        const dash = buildUsageDashboard(filteredRows);

        const append = (key, node) => { if (isUsageBlockEnabled(key)) root.appendChild(node); };

        append('totalRequests', createMetricBlock('总请求数', fmtNum(dash.totalReq), [`窗口 ${dash.cfg.label}`, `失败 ${fmtNum(dash.totalFail)}`]));
        append('totalTokens', createMetricBlock('总 Token 数', fmtCompactTokens(dash.totalTok), [`当前窗口`, `模型 ${fmtNum(dash.modelStats.length)}`]));
        append('rpm', createMetricBlock('RPM', fmtRate(dash.rpm), [`平均每分钟请求`, `曲线 ${fmtNum(dash.curveCount)}`]));
        append('tpm', createMetricBlock('TPM', fmtRate(dash.tpm), [`平均每分钟 Token`, `窗口 ${dash.cfg.label}`]));
        append('totalCost', createMetricBlock('总花费', dash.hasCost ? fmtMoney(dash.totalCost) : '--', [
          dash.costSource === 'usage' ? '基于 usage 成本字段' : dash.costSource === 'configured' ? '基于模型价格设置估算' : '请在区块设置中保存模型价格'
        ]));

        if (isUsageBlockEnabled('health')) {
          const block = createDashBlock('服务健康监测', 'full');
          block.appendChild(createHealthStrip(dash.healthBuckets || []));
          const meta = document.createElement('div');
          meta.className = 'dashMeta';
          meta.innerHTML = `<span>成功率 ${pct(dash.successRate)}</span><span>失败率 ${pct(dash.errorRate)}</span><span>平均延迟 ${dash.avgLatency != null ? `${Math.round(dash.avgLatency)} ms` : '--'}</span>`;
          block.appendChild(meta);
          append('health', block);
        }

        append('curveCount', createMetricBlock('曲线数量', fmtNum(dash.curveCount), ['按当前窗口自动分桶', dash.cfg.bucketMs >= 86400000 ? '日级曲线' : '小时级曲线']));

        if (isUsageBlockEnabled('requestTrend')) {
          const block = createDashBlock('请求趋势', 'wide');
          block.appendChild(createTrendChart(
            dash.trend.map((x) => ({ label: fmtBucketLabel(x.ts, dash.cfg.bucketMs), value: x.req })),
            '#8b8680',
            (v) => `${fmtNum(v)} 次`,
            '请求'
          ));
          const meta = document.createElement('div');
          meta.className = 'legendRow';
          meta.innerHTML = `<span><i class="legendDot" style="background:#8b8680"></i>请求数</span><span>桶数 ${fmtNum(dash.curveCount)}</span>`;
          block.appendChild(meta);
          append('requestTrend', block);
        }

        if (isUsageBlockEnabled('tokenTrend')) {
          const block = createDashBlock('Token 使用趋势', 'wide');
          block.appendChild(createTrendChart(
            dash.trend.map((x) => ({ label: fmtBucketLabel(x.ts, dash.cfg.bucketMs), value: x.tok })),
            '#c65746',
            (v) => `${fmtCompactTokens(v)} tok`,
            'Token'
          ));
          const meta = document.createElement('div');
          meta.className = 'legendRow';
          meta.innerHTML = `<span><i class="legendDot" style="background:#c65746"></i>Token</span><span>总计 ${fmtCompactTokens(dash.totalTok)}</span>`;
          block.appendChild(meta);
          append('tokenTrend', block);
        }

        if (isUsageBlockEnabled('tokenTypes')) {
          const block = createDashBlock('Token 类型分布', 'wide');
          block.appendChild(createDonutChart([
            { label: 'Input', value: dash.tokenTypes.input },
            { label: 'Output', value: dash.tokenTypes.output },
            { label: 'Reasoning', value: dash.tokenTypes.reasoning },
            { label: 'Cached', value: dash.tokenTypes.cached },
          ].filter((x) => x.value > 0)));
          append('tokenTypes', block);
        }

        if (isUsageBlockEnabled('costStats')) {
          const block = createDashBlock('花费统计', 'wide');
          const costItems = dash.modelStats.filter((x) => x.hasCost).map((x) => ({ label: x.name, value: x.cost })).slice(0, 8);
          if (!costItems.length) {
            const empty = document.createElement('div');
            empty.className = 'emptyHint';
            empty.textContent = '请在区块设置中保存模型价格，或等待 usage 明细提供成本字段';
            block.appendChild(empty);
          } else {
            block.appendChild(createBars(costItems, fmtMoney));
          }
          append('costStats', block);
        }

        if (isUsageBlockEnabled('modelStats')) {
          const block = createDashBlock('模型统计', 'full');
          block.appendChild(createTable(
            ['模型', '请求', 'Token', '失败', '花费'],
            dash.modelStats.map((x) => [x.name, fmtNum(x.req), fmtCompactTokens(x.tok), fmtNum(x.fail), x.hasCost ? fmtMoney(x.cost) : '--'])
          ));
          append('modelStats', block);
        }

        if (isUsageBlockEnabled('apiStats')) {
          const { el: block, body } = createCollapsibleDashBlock('API 详细统计', 'full', true);
          body.appendChild(createTable(
            ['API / Source', '请求', 'Token', '失败', '花费'],
            dash.apiStats.map((x) => [x.name, fmtNum(x.req), fmtCompactTokens(x.tok), fmtNum(x.fail), x.hasCost ? fmtMoney(x.cost) : '--'])
          ));
          append('apiStats', block);
        }

        if (isUsageBlockEnabled('requestEvents')) {
          const { el: block, body } = createCollapsibleDashBlock('请求事件明细', 'full', true);
          const list = document.createElement('div');
          list.className = 'eventList';
          if (!dash.events.length) {
            const empty = document.createElement('div');
            empty.className = 'emptyHint';
            empty.textContent = '当前窗口暂无请求事件';
            list.appendChild(empty);
          } else {
            dash.events.slice(0, 20).forEach((ev) => {
              const toks = getTokenBreakdown(ev);
              const item = document.createElement('div');
              item.className = 'eventItem';
              item.innerHTML = `
                <div class="eventHead"><strong>${ev.modelName || ev.model || 'unknown'}</strong><span>${fmtDate(ev.__tsMs)}</span></div>
                <div class="eventMeta">
                  <span>${ev.apiName || 'default'}</span>
                  <span>${ev.source || 'unknown'}</span>
                  <span>${ev.failed ? '失败' : '成功'}</span>
                  <span>${fmtCompactTokens(toks.total)} tok</span>
                  <span>${getDetailLatencyMs(ev) != null ? `${Math.round(getDetailLatencyMs(ev))} ms` : '--'}</span>
                  <span>auth ${ev.auth_index ?? 'unknown'}</span>
                </div>`;
              list.appendChild(item);
            });
          }
          body.appendChild(list);
          append('requestEvents', block);
        }
      }

      function buildRows() {
        const files = state.files || [];
        const windowCfg = getUsageWindowConfig();
        const byAuth = computeStats(state.usageDetails || [], windowCfg.cutoffMs);
        const usageEventsByAuth = groupUsageByAuth(state.usageDetails || []);

        const rows = [];
        for (const f of files) {
          const rawName = (f.name || '').toString();
          const email = (f.email || '').toString();
          const id = (f.id || '').toString();
          const provider = (f.provider || '').toString().toLowerCase();

          const typ = (f.type || '').toString().toLowerCase();
          const acctType = typ === 'cookie' ? 'cookie' : 'oauth';

          const authIndex = authIndexOf(f);
          const accountId = accountIdOf(f);
          const quotaEntry = authIndex ? (state.quotaByAuthIndex.get(authIndex) || null) : null;
          const quota = quotaEntry
            ? (quotaEntry.status === 'success'
              ? quotaEntry.data
              : (quotaEntry.status === 'loading' ? quotaEntry.prevData || null : null))
            : null;
          const quotaError = (quotaEntry && quotaEntry.status === 'error' ? quotaEntry.error : '') || (f.__quotaError || '');
          const quotaLoading = !!((quotaEntry && quotaEntry.status === 'loading') || f.__quotaLoading);
          const rawQ5 = quota && quota.windows ? quota.windows.primary : null;
          const rawQW = quota && quota.windows ? quota.windows.secondary : null;
          const quotaPlanType = (quota && quota.planType ? String(quota.planType) : '').toLowerCase();
          let q5 = rawQ5;
          let qW = rawQW;
          if (quotaPlanType === 'free' && rawQ5 && !rawQW && rawQ5.limitWindowSeconds === 604800) {
            qW = rawQ5;
            q5 = null;
          }
          const showQuota5h = !!q5 && quotaPlanType !== 'free';
          const hasQuotaData = (showQuota5h && q5 && typeof q5.usedPercent === 'number') || (qW && typeof qW.usedPercent === 'number');

          const isCodex = isCodexName(rawName) || provider === 'codex';
          const platform = provider === 'openai' || provider === 'codex' ? 'openai' : provider || 'other';

          const cls = classify(f);
          let statusKey = cls.key;
          let statusText = cls.label;
          let statusClass = cls.cls;
          const statusMsg = (f.status_message || '').toString();

          const limit = extractLimit(f);
          const now = Date.now();
          let cooldownUntilMs = limit && limit.resetsAtMs && Number.isFinite(limit.resetsAtMs) ? limit.resetsAtMs : null;
          let cooldownRemainingMs = cooldownUntilMs != null ? (cooldownUntilMs - now) : null;
          let isCoolingDown = (cooldownRemainingMs != null && cooldownRemainingMs > 0);

          // Prefer quota probe results when available.
          if (quota && !(qW && typeof qW.usedPercent === 'number' && qW.usedPercent >= 100) && !(showQuota5h && q5 && typeof q5.usedPercent === 'number' && q5.usedPercent >= 100) && !f.disabled) {
            statusKey = 'ready';
            statusText = '正常';
            statusClass = 'good';
            cooldownUntilMs = null;
            cooldownRemainingMs = null;
            isCoolingDown = false;
          } else if (qW && typeof qW.usedPercent === 'number' && qW.usedPercent >= 100 && qW.resetAtMs && qW.resetAtMs > now) {
            statusKey = 'quota';
            statusText = '额度用尽';
            statusClass = 'warn';
            cooldownUntilMs = qW.resetAtMs;
            cooldownRemainingMs = cooldownUntilMs - now;
            isCoolingDown = cooldownRemainingMs > 0;
          } else if (showQuota5h && q5 && typeof q5.usedPercent === 'number' && q5.usedPercent >= 100 && q5.resetAtMs && q5.resetAtMs > now) {
            statusKey = 'rate';
            statusText = '限流中';
            statusClass = 'warn';
            cooldownUntilMs = q5.resetAtMs;
            cooldownRemainingMs = cooldownUntilMs - now;
            isCoolingDown = cooldownRemainingMs > 0;
          }

          const scheduleAllowed = !(!!f.disabled || !!f.unavailable) && !((statusKey === 'rate' || statusKey === 'quota') && (isCoolingDown || cooldownUntilMs == null));

          const plan = planFromName(rawName)
            || (quota && quota.planType ? String(quota.planType) : '')
            || (limit && limit.planType ? (String(limit.planType).toLowerCase() === 'free' ? 'Free' : String(limit.planType)) : '');

          // Join usage: try id, then name, then email.
          const u = (authIndex && byAuth.get(authIndex)) || byAuth.get(id) || byAuth.get(rawName) || byAuth.get(email) || null;
          const usageEvents = authIndex !== '' ? (usageEventsByAuth.get(authIndex) || []) : [];
          const addedAtMs = addedAtOf(f);

          const alias = (id && aliases[id]) ? String(aliases[id] || '').trim() : '';
          rows.push({
            file: f,
            id,
            authIndex,
            accountId,
            rawName,
            email,
            displayName: alias || rawName.replace(/\.json$/i, ''),
            hasAlias: !!alias,
            plan,
            isCodex,
            platform,
            type: acctType,
            accountType: (f.account_type || '').toString(),
            account: (f.account || '').toString(),
            statusKey,
            statusText,
            statusClass,
            statusMsg,
            disabled: !!f.disabled,
            unavailable: !!f.unavailable,
            scheduleAllowed,
            limitKind: limit ? limit.kind : '',
            limitType: limit ? (limit.type || '') : '',
            limitMessage: limit ? (limit.message || '') : '',
            limitPromoMsg: limit ? (limit.promoMsg || '') : '',
            cooldownUntilMs: isCoolingDown ? cooldownUntilMs : null,
            cooldownRemainingMs: isCoolingDown ? cooldownRemainingMs : null,
            quota5hPct: q5 && typeof q5.usedPercent === 'number' ? q5.usedPercent : null,
            quota5hResetAtMs: q5 && q5.resetAtMs ? q5.resetAtMs : null,
            quota5hUsed: q5 ? q5.used : null,
            quota5hLimit: q5 ? q5.limit : null,
            quota5hUsedTokApprox: q5 ? sumTokensInQuotaWindow(usageEvents, q5.resetAtMs, q5.limitWindowSeconds) : null,
            showQuota5h,
            hasQuotaData: !!hasQuotaData,
            quotaWkPct: qW && typeof qW.usedPercent === 'number' ? qW.usedPercent : null,
            quotaWkResetAtMs: qW && qW.resetAtMs ? qW.resetAtMs : null,
            quotaWkUsed: qW ? qW.used : null,
            quotaWkLimit: qW ? qW.limit : null,
            quotaWkUsedTokApprox: qW ? sumTokensInQuotaWindow(usageEvents, qW.resetAtMs, qW.limitWindowSeconds) : null,
            quotaWkRemainingPct: qW && typeof qW.usedPercent === 'number' ? Math.max(0, 100 - qW.usedPercent) : null,
            quotaWkRemaining: qW ? (qW.remaining != null ? qW.remaining : ((qW.limit != null && qW.used != null) ? Math.max(0, qW.limit - qW.used) : null)) : null,
            quotaError,
            quotaLoading,
            windowKey: windowCfg.key,
            windowLabel: windowCfg.label,
            windowReq: u ? u.req : 0,
            windowTok: u ? u.tok : 0,
            windowFail: u ? u.fail : 0,
            windowCost: u ? u.cost : 0,
            lastUsed: u ? u.lastUsed : 0,
            addedAtMs,
          });
        }

        const sortBy = $('sortBy').value || 'recent';
        const sortDir = sortDirValue === 'asc' ? 'asc' : 'desc';
        const dirMul = sortDir === 'asc' ? 1 : -1;
        const cmpNum = (x, y) => {
          const a = Number(x) || 0;
          const b = Number(y) || 0;
          if (a === b) return 0;
          return a < b ? -1 : 1;
        };
        rows.sort((a, b) => {
          if (sortBy === 'usage') {
            const c1 = cmpNum(a.windowReq, b.windowReq);
            if (c1) return c1 * dirMul;
            const c2 = cmpNum(a.windowTok, b.windowTok);
            if (c2) return c2 * dirMul;
            return cmpNum(a.lastUsed, b.lastUsed) * -1;
          }
          if (sortBy === 'fail') {
            const c = cmpNum(a.windowFail, b.windowFail);
            if (c) return c * dirMul;
            return cmpNum(a.lastUsed, b.lastUsed) * -1;
          }
          if (sortBy === 'alpha') return a.displayName.localeCompare(b.displayName, 'zh-CN') * dirMul;
          if (sortBy === 'quotaRemaining') {
            const ap = a.quotaWkRemainingPct;
            const bp = b.quotaWkRemainingPct;
            const aPctKnown = Number.isFinite(ap);
            const bPctKnown = Number.isFinite(bp);
            if (aPctKnown && bPctKnown) {
              const cPct = cmpNum(ap, bp);
              if (cPct) return cPct * dirMul;
            }
            if (aPctKnown !== bPctKnown) return (aPctKnown ? -1 : 1) * dirMul;

            const ar = a.quotaWkRemaining;
            const br = b.quotaWkRemaining;
            const aKnown = Number.isFinite(ar);
            const bKnown = Number.isFinite(br);
            if (aKnown && bKnown) {
              const cAbs = cmpNum(ar, br);
              if (cAbs) return cAbs * dirMul;
            }
            if (aKnown !== bKnown) return (aKnown ? -1 : 1) * dirMul;
            return cmpNum(a.lastUsed, b.lastUsed) * dirMul;
          }
          if (sortBy === 'added') return cmpNum(a.addedAtMs, b.addedAtMs) * dirMul;
          return cmpNum(a.lastUsed, b.lastUsed) * dirMul;
        });

        return rows;
      }

      function render() {
        const allRows = buildRows();
        syncSelection(allRows);
        const summaryRows = allRows.filter(matchesFiltersWithoutGroups);
        const rows = allRows.filter(matchesFilters);
        syncSummaryButtons();
        renderUsageBlocks(rows);
        const total = rows.length;
        if (selectedStatusGroups.size === 0) {
          $('summaryText').textContent = 'N/A';
          $('summaryReady').textContent = 'N/A';
          $('summaryRate').textContent = 'N/A';
          $('summaryQuota').textContent = 'N/A';
          $('summaryDisabled').textContent = 'N/A';
          $('summaryEnabled').textContent = 'N/A';
        } else {
          $('summaryText').textContent = `${total} 个账号`;
          $('summaryReady').textContent = String(summaryRows.filter((r) => r.statusKey === 'ready').length);
          $('summaryRate').textContent = String(summaryRows.filter((r) => r.statusKey === 'rate').length);
          $('summaryQuota').textContent = String(summaryRows.filter((r) => r.statusKey === 'quota').length);
          $('summaryDisabled').textContent = String(summaryRows.filter((r) => r.statusKey === 'disabled').length);
          $('summaryEnabled').textContent = String(summaryRows.filter((r) => !r.disabled).length);
        }

        const pageSize = getPageSize();
        const totalPages = Math.max(1, Math.ceil(total / pageSize));
        if (state.page > totalPages) state.page = totalPages;
        if (state.page < 1) state.page = 1;

        const start = total === 0 ? 0 : (state.page - 1) * pageSize;
        const end = Math.min(total, start + pageSize);
        const pageRows = rows.slice(start, end);

        $('pageMeta').textContent = total === 0
          ? '暂无账号'
          : `第 ${state.page}/${totalPages} 页 · 显示 ${start + 1}-${end} / ${total} · 每页 ${pageSize}`;
        const selectedRows = allRows.filter((r) => isRowSelected(r));
        const selectedCodex = selectedRows.filter((r) => r.isCodex).length;
        $('selectionMeta').textContent = `已选 ${selectedRows.length} · Codex ${selectedCodex}`;
        $('selectionMeta').style.display = state.selectionMode ? 'inline-flex' : 'none';
        $('selectionTools').classList.toggle('active', state.selectionMode);
        $('btnToggleSelection').textContent = state.selectionMode ? '退出选择' : '选择账号';
        $('btnPrevPage').disabled = state.page <= 1;
        $('btnNextPage').disabled = state.page >= totalPages || total === 0;

        const pageKeys = pageRows.map(rowSelectionKey).filter(Boolean);
        const selectedOnPage = pageKeys.filter((key) => state.selectedKeys.has(key)).length;
        const btnSelectPage = $('btnSelectPage');
        const allSelectedOnPage = pageKeys.length > 0 && selectedOnPage === pageKeys.length;
        btnSelectPage.textContent = allSelectedOnPage ? '取消全选当页' : '全选当页';
        btnSelectPage.disabled = !state.selectionMode || pageKeys.length === 0;

        const grid = $('accountsGrid');
        grid.innerHTML = '';
        grid.style.setProperty('--cols', String(getColumnsPerRow()));

        if (pageRows.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'emptyState';
          empty.textContent = state.loadError
            ? `加载失败：${state.loadError}`
            : (selectedStatusGroups.size === 0 ? '当前没有选中任何显示组别' : '没有符合当前筛选条件的账号');
          grid.appendChild(empty);
          return;
        }

        for (const r of pageRows) grid.appendChild(mkAccountCard(r));
      }

      async function loadAll(opts = {}) {
        const { signal, managed = true } = opts || {};
        const oldText = $('btnRefresh').textContent;
        if (managed) setRefreshButtonState(true, '刷新中...');
        state.loadingFiles = true;
        const canRefreshUsage = dangerousActionsAvailable && hasAdminKey();
        try {
          throwIfAborted(signal);
          const filesRes = await apiFetch('/auth-files', { signal });
          const filesJson = await filesRes.json();
          const files = filesJson.files || [];

          state.files = files;
          state.authFileMetaByName = new Map();
          state.lastLoadAt = Date.now();
          state.loadError = '';
          state.loadingFiles = false;
          state.loadingUsage = state.usageDetails.length === 0;
          setConn(true, '已连接');
          render();

          throwIfAborted(signal);
          const usageRes = await apiFetch(canRefreshUsage ? '/refresh-usage-cache' : '/usage-cache', { signal });
          const usageJson = await usageRes.json();
          const usage = usageJson.data?.usage || usageJson.data || usageJson.usage || usageJson;
          const details = flattenUsage(usage);
          const byAuth = computeStats(details, getUsageWindowConfig().cutoffMs);

          state.usageDetails = details;
          state.usageByAuth = byAuth;
          state.lastUsageSeenByAuth = latestUsageTsByAuth(details);
          state.loadingUsage = false;
          saveDashboardCache({ files, usageDetails: details, cachedAt: Date.now() });
        } catch (e) {
          if (isAbortError(e)) return;
          state.loadingFiles = false;
          state.loadingUsage = false;
          state.loadError = (e && e.message) ? e.message : String(e);
          setConn(false, '连接失败');
          toast(state.loadError);
        } finally {
          if (managed) setRefreshButtonState(false, oldText);
          render();
        }
      }

      let _renderQueued = false;
      function scheduleRender() {
        if (_renderQueued) return;
        _renderQueued = true;
        requestAnimationFrame(() => {
          _renderQueued = false;
          render();
        });
      }

      async function refreshQuota(opts = {}) {
        const { skipLoad = false, silentNoTargets = false, preserveButtonText = false, explicitRows = null, signal, managed = true } = opts || {};
        const btn = $('btnRefresh');
        const oldText = btn ? btn.textContent : '刷新';
        if (managed && !preserveButtonText) setRefreshButtonState(true, '刷新额度中...');
        try {
          if (!dangerousActionsAvailable || !hasAdminKey()) throw new Error('需要管理员 key，请先进入管理员模式');
          if (!backendHasManagementKey) throw new Error('请先在设置中保存后台管理密钥');
          if (!skipLoad && (!state.files || state.files.length === 0)) {
            throw new Error('请先刷新列表');
          }
          throwIfAborted(signal);

          const allRows = buildRows();
          const selectedRows = allRows.filter((r) => isRowSelected(r));
          const scopeRows = Array.isArray(explicitRows)
            ? explicitRows
            : (selectedRows.length > 0 ? selectedRows : allRows.filter(matchesFilters));
          const targets = scopeRows.filter((r) => r.isCodex);

          if (targets.length === 0) {
            setQuotaProgress(false, 0, 0);
            if (!silentNoTargets) toast(Array.isArray(explicitRows)
              ? '这个账号没有可刷新额度的 Codex 信息'
              : (selectedRows.length > 0 ? '当前选中项里没有可刷新额度的 Codex 账号' : '没有可刷新额度的 Codex 账号'));
            return;
          }

          const total = targets.length;
          let done = 0;
          let ok = 0;
          let fail = 0;

          const startedAt = Date.now();
          const conc = Math.min(3, total);
          const queue = targets.slice();

          const getCachedQuotaSnapshot = (key) => {
            const prev = key ? state.quotaByAuthIndex.get(key) : null;
            if (!prev) return null;
            if (prev.status === 'success' && prev.data) return prev.data;
            if (prev.status === 'loading' && prev.prevData) return prev.prevData;
            return null;
          };

          for (const r of targets) {
            const key = r.authIndex !== '' ? r.authIndex : rowSelectionKey(r);
            const prevData = getCachedQuotaSnapshot(key);
            r.file.__quotaLoading = r.authIndex === '';
            r.file.__quotaError = '';
            if (key) state.quotaByAuthIndex.set(key, { status: 'loading', prevData, fetchedAt: Date.now() });
          }
          scheduleRender();

          const tick = () => {
            if (!preserveButtonText) setRefreshButtonState(true, `刷新 ${done}/${total}`);
            setQuotaProgress(true, done, total);
          };
          tick();

          const worker = async () => {
            while (queue.length) {
              throwIfAborted(signal);
              const r = queue.shift();
              if (!r) return;
              try {
                const file = r.file;
                const authIndex = authIndexOf(file);
                const key = authIndex !== '' ? authIndex : rowSelectionKey(r);
                const prevData = getCachedQuotaSnapshot(key);
                file.__quotaLoading = false;
                file.__quotaError = '';
                if (key) state.quotaByAuthIndex.set(key, { status: 'loading', prevData, fetchedAt: Date.now() });
                scheduleRender();
                throwIfAborted(signal);
                const data = await fetchCodexQuota(file, signal);
                state.quotaByAuthIndex.set(key, { status: 'success', data, fetchedAt: Date.now() });
                persistQuotaCache();
                ok += 1;
              } catch (e) {
                if (isAbortError(e)) throw e;
                r.file.__quotaLoading = false;
                r.file.__quotaError = (e && e.message) ? e.message : String(e);
                const key = r.authIndex !== '' ? r.authIndex : rowSelectionKey(r);
                state.quotaByAuthIndex.set(key, { status: 'error', error: (e && e.message) ? e.message : String(e), fetchedAt: Date.now() });
                persistQuotaCache();
                fail += 1;
              } finally {
                done += 1;
                tick();
                scheduleRender();
              }
            }
          };

          await Promise.all(Array.from({ length: conc }, worker));
          const ms = Date.now() - startedAt;
          setQuotaProgress(true, total, total, `完成 ${ok}/${total}，失败 ${fail}`);
          toast(`额度刷新完成：成功 ${ok}，失败 ${fail}（${fmtDurMs(ms)}）`);
          setTimeout(() => setQuotaProgress(false, 0, 0), 1800);
        } catch (e) {
          if (isAbortError(e)) return;
          setQuotaProgress(false, 0, 0);
          toast((e && e.message) ? e.message : String(e));
        } finally {
          if (managed && !preserveButtonText) setRefreshButtonState(false, oldText);
          render();
        }
      }

      async function refreshAll() {
        if (state.refreshing) return;
        if (!dangerousActionsAvailable || !hasAdminKey()) {
          toast('需要管理员 key，请先进入管理员模式');
          return;
        }
        const controller = new AbortController();
        state.refreshAbortController = controller;
        state.refreshing = true;
        setRefreshButtonState(true, '刷新中...');
        try {
          if (!backendHasManagementKey) throw new Error('后台尚未配置管理密钥');
          await loadAll({ signal: controller.signal, managed: false });
          throwIfAborted(controller.signal);
          if (state.files && state.files.length > 0) {
            await refreshQuota({ skipLoad: true, silentNoTargets: true, preserveButtonText: true, signal: controller.signal, managed: false });
          }
        } catch (e) {
          if (!isAbortError(e)) throw e;
        } finally {
          if (state.refreshAbortController === controller) state.refreshAbortController = null;
          state.refreshing = false;
          setRefreshButtonState(false, '刷新');
          render();
        }
      }

      async function watchUsageChanges() {
        if (!backendHasManagementKey || !dangerousActionsAvailable || !hasAdminKey() || state.refreshing || state.usageWatchBusy) return;
        state.usageWatchBusy = true;
        try {
          const res = await apiFetch('/usage-cache');
          const usageJson = await res.json();
          const usage = usageJson.data?.usage || usageJson.data || usageJson.usage || usageJson;
          const details = flattenUsage(usage);
          const nextSeen = latestUsageTsByAuth(details);
          const changedAuth = [];
          for (const [authIndex, ts] of nextSeen.entries()) {
            const prev = state.lastUsageSeenByAuth.get(authIndex) || 0;
            if (ts > prev) changedAuth.push(authIndex);
          }
          state.usageDetails = details;
          state.usageByAuth = computeStats(details, getUsageWindowConfig().cutoffMs);
          state.lastUsageSeenByAuth = nextSeen;

          if (changedAuth.length > 0) {
            const rows = buildRows().filter((r) => changedAuth.includes(r.authIndex));
            if (rows.length > 0) {
              await refreshQuota({ skipLoad: true, silentNoTargets: true, preserveButtonText: true, explicitRows: rows, managed: false });
            }
          }
          render();
        } catch (_) {
          // keep watcher silent
        } finally {
          state.usageWatchBusy = false;
        }
      }

      function pauseRefresh() {
        if (!state.refreshAbortController) return;
        state.refreshAbortController.abort();
        state.refreshAbortController = null;
        state.refreshing = false;
        state.loadingFiles = false;
        state.loadingUsage = false;
        setRefreshButtonState(false, '刷新');
        setQuotaProgress(false, 0, 0);
        toast('已暂停当前刷新');
        render();
      }

      async function onDelete(row) {
        const name = normalizeAuthFileName(row.rawName);
        modal({
          title: '删除账号',
          body: `确认删除 ${name} ？这会删除 auth 文件，并让该账号退出调度。`,
          actions: [
            { label: '取消', kind: 'default', onClick: closeModal },
            {
              label: '删除',
              kind: 'danger',
              onClick: async () => {
                try {
                  await apiFetch(`/v0/management/auth-files?name=${encodeURIComponent(name)}`, { method: 'DELETE' });
                  toast('已删除');
                  closeModal();
                  await loadAll();
                } catch (e) {
                  toast((e && e.message) ? e.message : String(e));
                }
              }
            }
          ]
        });
      }

      async function onMore(row) {
        const box = document.createElement('div');
        box.style.display = 'grid';
        box.style.gap = '10px';
        const p = document.createElement('div');
        p.textContent = '可用操作：';
        box.appendChild(p);
        const btns = document.createElement('div');
        btns.style.display = 'flex';
        btns.style.gap = '10px';
        btns.style.flexWrap = 'wrap';
        box.appendChild(btns);

        const name = normalizeAuthFileName(row.rawName);

        const b1 = document.createElement('button');
        b1.textContent = '下载凭证';
        b1.onclick = async () => {
          try {
            const res = await apiFetch(`/v0/management/auth-files/download?name=${encodeURIComponent(name)}`);
            const blob = await res.blob();
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = name;
            a.click();
            URL.revokeObjectURL(a.href);
            toast('已开始下载');
          } catch (e) {
            toast((e && e.message) ? e.message : String(e));
          }
        };
        btns.appendChild(b1);

        const b2 = document.createElement('button');
        b2.textContent = '复制邮箱';
        b2.onclick = async () => {
          try {
            await navigator.clipboard.writeText(row.email || '');
            toast('已复制');
          } catch (_) {
            toast('复制失败');
          }
        };
        btns.appendChild(b2);

        modal({
          title: '更多',
          body: box,
          actions: [{ label: '关闭', onClick: closeModal }]
        });
      }

      async function addCodex() {
        try {
          const res = await apiFetch('/v0/management/codex-auth-url?is_webui=true');
          const j = await res.json();
          if (!j || !j.url || !j.state) throw new Error('invalid codex-auth-url response');
          window.open(j.url, '_blank', 'noopener');

          modal({
            title: '添加 Codex 账号',
            body: '已打开登录页面。请在新页面完成登录，当前页面将自动轮询状态。',
            actions: [{ label: '关闭', onClick: closeModal }]
          });

          const stateId = j.state;
          const started = Date.now();
          while (Date.now() - started < 3 * 60 * 1000) {
            await new Promise(r => setTimeout(r, 1000));
            const stRes = await apiFetch(`/v0/management/get-auth-status?state=${encodeURIComponent(stateId)}`);
            const st = await stRes.json();
            if (st && st.status === 'ok') {
              toast('账号添加成功');
              await loadAll();
              return;
            }
            if (st && st.status === 'error') {
              throw new Error(st.error || 'Authentication failed');
            }
          }
          toast('轮询超时：请稍后手动刷新');
        } catch (e) {
          toast((e && e.message) ? e.message : String(e));
        }
      }

      $('btnRefresh').onclick = refreshAll;
      $('btnRefreshAll').onclick = refreshAll;
      $('btnPauseRefresh').onclick = pauseRefresh;
      $('btnAdminMode').onclick = () => {
        if (dangerousActionsAvailable) {
          adminLogout();
          toast('已退出管理员模式');
          return;
        }
        const wrap = document.createElement('div');
        wrap.style.display = 'grid';
        wrap.style.gap = '10px';
        const f = document.createElement('div');
        f.className = 'field';
        const l = document.createElement('label');
        l.textContent = '管理员密码';
        const i = document.createElement('input');
        i.type = 'password';
        f.appendChild(l);
        f.appendChild(i);
        wrap.appendChild(f);
        modal({
          title: '管理员模式',
          body: wrap,
          actions: [
            { label: '取消', onClick: closeModal },
            {
              label: '登录',
              kind: 'primary',
              onClick: async () => {
                await adminLogin(i.value);
                closeModal();
                toast('已进入管理员模式');
                render();
              }
            }
          ]
        });
      };
      $('btnUsageBlocks').onclick = openUsageBlockSettings;
      $('btnToggleUsage').onclick = () => {
        usageCollapsed = !usageCollapsed;
        syncUsageWrap();
        persist();
      };
      $('btnToggleSettings').onclick = () => {
        settingsCollapsed = !settingsCollapsed;
        syncSettingsShell();
        persist();
      };

      ['q','columnsPerRow','usageWindow','sortBy'].forEach((id) => {
        $(id).addEventListener('input', () => { resetPage(); render(); });
        $(id).addEventListener('change', () => { persist(); resetPage(); render(); });
      });

      document.querySelectorAll('#statusGroups input[type="checkbox"]').forEach((input) => {
        input.addEventListener('change', () => {
          if (input.checked) selectedStatusGroups.add(input.value);
          else selectedStatusGroups.delete(input.value);
          syncStatusGroupInputs();
          persist();
          resetPage();
          render();
        });
      });

      $('summaryBtnReady').onclick = (e) => applySummaryGroup(['ready'], e);
      $('summaryBtnRate').onclick = (e) => applySummaryGroup(['rate'], e);
      $('summaryBtnQuota').onclick = (e) => applySummaryGroup(['quota'], e);
      $('summaryBtnDisabled').onclick = (e) => applySummaryGroup(['disabled'], e);
      $('summaryBtnEnabled').onclick = (e) => applySummaryGroup(['ready', 'rate', 'quota', 'bad'], e);
      $('summaryText').style.cursor = 'pointer';
      $('summaryText').title = '点击恢复显示全部组别';
      $('summaryText').onclick = () => setStatusGroups(STATUS_GROUP_KEYS.slice());

      $('btnSortDesc').onclick = () => {
        sortDirValue = 'desc';
        syncSortDirButtons();
        persist();
        resetPage();
        render();
      };
      $('btnSortAsc').onclick = () => {
        sortDirValue = 'asc';
        syncSortDirButtons();
        persist();
        resetPage();
        render();
      };

      $('pageSize').addEventListener('change', () => {
        persist();
        syncPageSizeCustom();
        resetPage();
        render();
      });
      $('pageSizeCustom').addEventListener('input', () => {
        persist();
        resetPage();
        render();
      });
      $('btnToggleSelection').onclick = () => {
        state.selectionMode = !state.selectionMode;
        if (!state.selectionMode) state.selectedKeys.clear();
        render();
      };
      $('btnSelectPage').onclick = () => {
        if (!state.selectionMode) return;
        const rows = buildRows().filter(matchesFilters);
        const pageSize = getPageSize();
        const start = rows.length === 0 ? 0 : (state.page - 1) * pageSize;
        const end = Math.min(rows.length, start + pageSize);
        const pageRows = rows.slice(start, end);
        const pageKeys = pageRows.map(rowSelectionKey).filter(Boolean);
        const allSelectedOnPage = pageKeys.length > 0 && pageKeys.every((key) => state.selectedKeys.has(key));
        for (const r of pageRows) setRowSelected(r, !allSelectedOnPage);
        render();
      };
      $('btnClearSelection').onclick = () => {
        state.selectedKeys.clear();
        render();
      };
      $('btnPrevPage').onclick = () => {
        if (state.page > 1) {
          state.page -= 1;
          render();
        }
      };
      $('btnNextPage').onclick = () => {
        state.page += 1;
        render();
      };

      let timer = null;
      let usageWatchTimer = null;
      let relativeTimeTimer = null;
      let autoTickRunning = false;
      async function autoRefreshAll() {
        if (autoTickRunning) return;
        autoTickRunning = true;
        try {
          await refreshAll();
        } finally {
          autoTickRunning = false;
        }
      }
      function resetAuto() {
        if (timer) { clearInterval(timer); timer = null; }
        if (!dangerousActionsAvailable || !hasAdminKey()) return;
        const min = parseInt(($('autoRefresh').value || '').trim(), 10);
        if (!Number.isFinite(min) || min <= 0) return;
        timer = setInterval(autoRefreshAll, min * 60 * 1000);
      }
      function resetUsageWatcher() {
        if (usageWatchTimer) { clearInterval(usageWatchTimer); usageWatchTimer = null; }
        if (!backendHasManagementKey || !dangerousActionsAvailable || !hasAdminKey()) return;
        usageWatchTimer = setInterval(watchUsageChanges, 15000);
      }
      function resetRelativeTimeTicker() {
        if (relativeTimeTimer) { clearInterval(relativeTimeTimer); relativeTimeTimer = null; }
        relativeTimeTimer = setInterval(() => {
          if (!state.refreshing && !state.loadingFiles) render();
        }, 30000);
      }
      $('autoRefresh').addEventListener('change', () => { persist(); resetAuto(); });
      $('autoRefresh').addEventListener('input', () => { persist(); resetAuto(); });

      // Initial
      async function init() {
        syncPageSizeCustom();
        syncStatusGroupInputs();
        syncSortDirButtons();
        syncSettingsShell();
        syncUsageWrap();
        syncReadonlyMode();
        await ensureBackendPanelConfig();
        resetAuto();
        resetUsageWatcher();
        resetRelativeTimeTicker();
        state.quotaByAuthIndex = await loadQuotaCache();
        const dashCache = await loadDashboardCache();
        if (dashCache && Array.isArray(dashCache.files)) {
          state.files = dashCache.files;
          state.usageDetails = Array.isArray(dashCache.usageDetails) ? dashCache.usageDetails : [];
          state.usageByAuth = computeStats(state.usageDetails, getUsageWindowConfig().cutoffMs);
          state.lastUsageSeenByAuth = latestUsageTsByAuth(state.usageDetails);
          if (state.files.length > 0) setConn(true, '已连接');
        }
        render();
        if (backendHasManagementKey) loadAll();
      }

      init();
    </script>
  </body>
</html>
