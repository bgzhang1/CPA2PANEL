<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>账号管理 | CLIProxyAPI</title>
    <style>
      :root {
        --bg: #faf9f5;
        --panel: #fffdf9;
        --panel2: #f6f4ee;
        --text: #2d2a26;
        --muted: #6d6760;
        --muted2: #a29c95;
        --border: #e3e1db;
        --good: #10b981;
        --warn: #e0aa14;
        --bad: #c65746;
        --accent: #8b8680;
        --accent-2: #726d67;
        --chip: #f0eee8;
        --shadow: 0 10px 18px -3px rgb(0 0 0 / 0.1);
        --shadow-lg: 0 12px 26px rgba(0, 0, 0, .14);
        --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: var(--sans);
        color: var(--text);
        background:
          radial-gradient(1200px 600px at 100% -5%, rgba(139, 134, 128, .12), transparent 55%),
          radial-gradient(900px 500px at 0% 0%, rgba(214, 205, 193, .22), transparent 55%),
          radial-gradient(900px 700px at 0% 100%, rgba(233, 230, 223, .9), transparent 60%),
          var(--bg);
      }

      a { color: inherit; }

      .wrap {
        max-width: 1400px;
        margin: 0 auto;
        padding: 18px 14px 28px;
      }

      .top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 14px;
        margin-bottom: 12px;
      }

      .title {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .title h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.2px;
      }
      .title .sub {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        color: var(--muted);
        font-size: 12px;
      }

      .summaryHero {
        display: grid;
        gap: 10px;
        margin-top: 6px;
      }

      .summaryMain {
        font-size: 32px;
        line-height: 1;
        font-weight: 800;
        letter-spacing: -0.03em;
        color: var(--text);
      }

      .summaryStats {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .summaryStat {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: rgba(255,253,249,.9);
        color: var(--muted);
        font-size: 12px;
        cursor: pointer;
        transition: border-color .16s ease, background-color .16s ease, color .16s ease, transform .16s ease;
      }

      .summaryStat:hover {
        transform: translateY(-1px);
        border-color: var(--accent);
      }

      .summaryStat.active {
        border-color: var(--accent);
        background: rgba(139, 134, 128, .12);
        color: var(--text);
      }

      .summaryStat strong {
        color: var(--text);
        font-weight: 800;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid var(--border);
        background: var(--chip);
        border-radius: 999px;
        padding: 3px 10px;
        font-size: 12px;
        color: var(--muted);
      }
      .chip.readonly {
        border-color: rgba(224,170,20,.32);
        background: rgba(224,170,20,.10);
        color: #926d00;
      }
      .dot { width: 8px; height: 8px; border-radius: 999px; background: var(--muted2); }
      .dot.good { background: var(--good); }
      .dot.warn { background: var(--warn); }
      .dot.bad { background: var(--bad); }

      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 18px;
        box-shadow: var(--shadow-lg);
        overflow: hidden;
      }

      .toolbar {
        padding: 12px;
        display: grid;
        grid-template-columns: 1fr;
        gap: 10px;
        border-bottom: 1px solid var(--border);
        background: linear-gradient(180deg, rgba(240,238,232,0.85), rgba(255,253,249,0.95));
      }

      .settingsShell {
        border-bottom: 1px solid var(--border);
        background: linear-gradient(180deg, rgba(240,238,232,0.78), rgba(255,253,249,0.92));
      }

      body.readonlyView .floatingRefresh,
      body.readonlyView #btnUsageBlocks,
      body.readonlyView .settingsToggle,
      body.readonlyView .toolbar {
        display: none;
      }

      body.readonlyView .settingsShell {
        border-bottom: 0;
        background: transparent;
      }

      body.readonlyView .settingsShell.collapsed .settingsBody {
        display: grid;
      }

      .settingsToggle {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 12px;
        border: 0;
        border-radius: 0;
        background: transparent;
        box-shadow: none;
      }

      .settingsToggle:hover:not(:disabled) {
        transform: none;
        box-shadow: none;
        border-color: transparent;
      }

      .settingsToggleLeft {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
      }

      .settingsToggleMeta {
        font-size: 12px;
        color: var(--muted);
      }

      .settingsChevron {
        color: var(--muted);
        transition: transform .16s ease;
      }

      .settingsShell.collapsed .settingsChevron {
        transform: rotate(-90deg);
      }

      .settingsBody {
        display: grid;
      }

      .settingsShell.collapsed .settingsBody {
        display: none;
      }

      .row {
        display: grid;
        grid-template-columns: 1fr;
        gap: 10px;
      }
      @media (min-width: 980px) {
        .row { grid-template-columns: 1.2fr 0.8fr; }
      }

      .fields {
        display: grid;
        grid-template-columns: 1fr;
        gap: 10px;
      }
      @media (min-width: 980px) {
        .fields { grid-template-columns: 1.2fr 1fr 0.8fr; }
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      label {
        font-size: 12px;
        color: var(--muted);
      }

      .seg2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .seg2 button {
        padding: 8px 10px;
        font-size: 12px;
      }

      .seg2 button.active {
        border-color: var(--accent);
        background: var(--accent);
        color: #fff;
      }

      .groupFilter {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .groupOption {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 7px 10px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: #fffdf9;
        color: var(--muted);
        font-size: 12px;
        cursor: pointer;
        user-select: none;
        transition: border-color .16s ease, background-color .16s ease, color .16s ease, box-shadow .16s ease;
      }

      .groupOption input {
        margin: 0;
      }

      .groupOption.active {
        border-color: var(--accent);
        background: rgba(139, 134, 128, .1);
        color: var(--text);
        box-shadow: 0 4px 10px rgba(0,0,0,.05);
      }

      input[type="text"], input[type="password"], input[type="number"], select, textarea {
        width: 100%;
        padding: 10px 10px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.94);
        color: var(--text);
        outline: none;
        transition: border-color 0.18s ease, box-shadow 0.18s ease, background-color 0.18s ease;
      }
      input::placeholder { color: var(--muted2); }
      input[type="checkbox"] { accent-color: var(--accent); }
      input:focus, select:focus {
        border-color: #cfc8be;
        box-shadow: 0 0 0 3px rgba(139, 134, 128, 0.14);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: end;
        justify-content: flex-start;
      }
      @media (min-width: 980px) {
        .actions { justify-content: flex-end; }
      }

      button {
        border: 1px solid var(--border);
        background: #fffdf9;
        color: var(--text);
        padding: 9px 12px;
        border-radius: 12px;
        cursor: pointer;
        font-weight: 650;
        letter-spacing: 0.1px;
        transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease, background-color 0.16s ease;
      }
      button:hover:not(:disabled) {
        transform: translateY(-1px);
        box-shadow: 0 6px 14px rgba(0, 0, 0, 0.08);
        border-color: #d5d2cb;
      }
      button:active:not(:disabled) {
        transform: translateY(0) scale(0.985);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }
      button.primary {
        border-color: var(--accent);
        background: var(--accent);
        color: #fff;
      }
      button.danger {
        border-color: rgba(198, 87, 70, .35);
        background: rgba(198, 87, 70, .08);
        color: var(--bad);
      }
      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .hint {
        color: var(--muted);
        font-size: 12px;
      }
      .hint code { font-family: var(--mono); font-size: 11px; }

      .progressWrap {
        display: none;
        gap: 8px;
        align-items: center;
        grid-template-columns: 1fr auto;
      }
      .progressBar {
        height: 10px;
        border-radius: 999px;
        overflow: hidden;
        border: 1px solid var(--border);
        background: #f0eee8;
      }
      .progressBar > div {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, var(--accent), #b2aca3);
        transition: width 0.18s ease;
      }
      .progressText {
        font-size: 12px;
        color: var(--muted);
        font-family: var(--mono);
        white-space: nowrap;
      }

      .filters {
        padding: 10px 12px;
        display: grid;
        grid-template-columns: 1fr;
        gap: 10px;
        border-bottom: 1px solid var(--border);
      }
      @media (min-width: 980px) {
        .filters { grid-template-columns: 1.5fr 0.9fr 1fr 0.8fr 1fr 1fr 1fr; }
      }

      .listWrap {
        padding: 12px;
        display: grid;
        gap: 12px;
      }

      .usageWrap {
        padding: 12px;
        display: grid;
        gap: 12px;
        border-top: 1px solid var(--border);
        border-bottom: 1px solid var(--border);
        background: linear-gradient(180deg, rgba(246,244,238,.72), rgba(255,253,249,.96));
      }

      .usageWrap.collapsed {
        gap: 0;
      }

      .usageHeader {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        flex-wrap: nowrap;
      }

      .usageToggle {
        flex: 1;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 0;
        border: 0;
        background: transparent;
        box-shadow: none;
        border-radius: 0;
      }

      .usageToggle:hover:not(:disabled) {
        transform: none;
        box-shadow: none;
        border-color: transparent;
      }

      .usageChevron {
        color: var(--muted);
        transition: transform .16s ease;
      }

      .usageWrap.collapsed .usageChevron {
        transform: rotate(-90deg);
      }

      .usageBody {
        display: grid;
      }

      .usageWrap.collapsed .usageBody {
        display: none;
      }

      .usageTitle {
        display: grid;
        gap: 4px;
        justify-items: start;
        text-align: left;
      }

      .usageTitle strong {
        font-size: 18px;
        font-weight: 400;
      }

      .usageBlocks {
        display: grid;
        grid-template-columns: repeat(12, minmax(0, 1fr));
        gap: 12px;
      }

      .dashBlock {
        grid-column: span 3;
        display: grid;
        gap: 10px;
        padding: 14px;
        border-radius: 16px;
        border: 1px solid var(--border);
        background: #fffdf9;
        box-shadow: var(--shadow);
        min-width: 0;
        transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
      }
      .dashBlock:hover {
        transform: translateY(-1px);
        box-shadow: var(--shadow-lg);
      }

      .dashBlock.wide { grid-column: span 6; }
      .dashBlock.full { grid-column: 1 / -1; }

      .dashBlockHead {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: center;
      }

      .dashToggle {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        padding: 0;
        border: 0;
        background: transparent;
        box-shadow: none;
        border-radius: 0;
      }
      .dashToggle:hover:not(:disabled) {
        transform: none;
        box-shadow: none;
        border-color: transparent;
      }
      .dashToggleIcon {
        font-size: 12px;
        color: var(--muted);
        transition: transform .16s ease, color .16s ease;
      }
      .dashBlock.collapsed .dashToggleIcon {
        transform: rotate(-90deg);
      }
      .dashBody {
        display: grid;
        gap: 10px;
        overflow: hidden;
        transition: opacity .16s ease, transform .16s ease;
      }
      .dashBlock.collapsed .dashBody {
        display: none;
      }

      .dashBlockTitle {
        font-size: 13px;
        font-weight: 700;
      }

      .dashValue {
        font-size: 28px;
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.02em;
      }

      .dashMeta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 12px;
        color: var(--muted);
        font-size: 12px;
      }

      .miniGrid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .miniItem {
        min-width: 0;
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: var(--panel2);
      }

      .miniItem .k {
        font-size: 11px;
        color: var(--muted2);
        margin-bottom: 4px;
      }

      .miniItem .v {
        font-size: 15px;
        font-weight: 700;
        overflow-wrap: anywhere;
      }

      .chartBox {
        display: grid;
        gap: 8px;
        min-width: 0;
      }

      .chartWrap {
        position: relative;
      }

      .chartSvg {
        width: 100%;
        height: 180px;
        display: block;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: linear-gradient(180deg, rgba(246,244,238,.68), rgba(255,253,249,.9));
      }

      .chartTooltip {
        position: absolute;
        z-index: 3;
        min-width: 110px;
        padding: 8px 10px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: rgba(255,253,249,.97);
        box-shadow: var(--shadow-lg);
        font-size: 12px;
        color: var(--text);
        pointer-events: none;
        display: none;
      }

      .chartTooltip .muted {
        color: var(--muted);
        margin-top: 4px;
      }

      .donutWrap {
        display: grid;
        grid-template-columns: 180px 1fr;
        gap: 14px;
        align-items: center;
      }

      .donutSvg {
        width: 180px;
        height: 180px;
        display: block;
        margin: 0 auto;
      }

      .donutCenter {
        font-size: 12px;
        fill: var(--muted);
        text-anchor: middle;
      }

      .donutCenter strong {
        font-size: 16px;
      }

      .settingsSection {
        display: grid;
        gap: 10px;
      }

      .settingsSectionTitle {
        font-size: 12px;
        color: var(--muted2);
        font-weight: 700;
      }

      .pricingGrid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px 14px;
      }

      .pricingItem {
        display: grid;
        gap: 6px;
      }

      .modelPricingForm {
        display: grid;
        gap: 10px;
      }

      .pricingActions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .savedPricingList {
        display: grid;
        gap: 8px;
      }

      .savedPricingRow {
        display: grid;
        gap: 6px;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--panel2);
      }

      @media (max-width: 760px) {
        .donutWrap, .pricingGrid { grid-template-columns: 1fr; }
      }

      .legendRow {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 12px;
        font-size: 12px;
        color: var(--muted);
      }

      .legendDot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-right: 6px;
      }

      .healthStrip {
        position: relative;
        display: grid;
        gap: 12px;
      }

      .healthDots {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }

      .healthDot {
        width: 12px;
        height: 12px;
        padding: 0;
        border-radius: 999px;
        border: 1px solid rgba(109,103,96,.12);
        background: #ddd7cf;
        box-shadow: inset 0 0 0 1px rgba(255,255,255,.25);
        transform: none;
      }

      .healthDot:hover:not(:disabled) {
        transform: scale(1.15);
        box-shadow: 0 6px 14px rgba(0,0,0,.08), inset 0 0 0 1px rgba(255,255,255,.22);
      }

      .healthDot:active:not(:disabled) {
        transform: scale(1.02);
      }

      .healthDot.good { background: #10b981; border-color: rgba(16,185,129,.25); }
      .healthDot.warn { background: #e0aa14; border-color: rgba(224,170,20,.25); }
      .healthDot.bad { background: #c65746; border-color: rgba(198,87,70,.25); }
      .healthDot.empty { background: #ddd7cf; border-color: rgba(109,103,96,.15); }

      .healthTooltip {
        position: absolute;
        z-index: 3;
        min-width: 136px;
        padding: 9px 10px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: rgba(255,253,249,.98);
        box-shadow: var(--shadow-lg);
        font-size: 12px;
        color: var(--text);
        pointer-events: none;
        display: none;
      }

      .tableLite {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }

      .tableLite th,
      .tableLite td {
        text-align: left;
        padding: 8px 6px;
        border-bottom: 1px solid var(--border);
        vertical-align: top;
      }

      .tableLite th {
        color: var(--muted2);
        font-weight: 600;
      }

      .scrollTable {
        overflow: auto;
      }

      .eventList {
        display: grid;
        gap: 8px;
      }

      .eventItem {
        display: grid;
        gap: 6px;
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: var(--panel2);
      }

      .eventHead {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
        font-size: 12px;
      }

      .eventMeta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        color: var(--muted);
        font-size: 12px;
      }

      .emptyHint {
        color: var(--muted);
        font-size: 12px;
      }

      .settingsGrid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px 14px;
      }

      .settingsItem {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      @media (max-width: 1200px) {
        .dashBlock { grid-column: span 6; }
      }

      @media (max-width: 760px) {
        .dashBlock, .dashBlock.wide { grid-column: 1 / -1; }
        .miniGrid, .settingsGrid { grid-template-columns: 1fr; }
      }

      .pageBar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        justify-content: space-between;
        border: 1px solid var(--border);
        background: #f6f4ee;
        border-radius: 14px;
        padding: 10px 12px;
      }

      .pageMeta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 12px;
        align-items: center;
        font-size: 12px;
        color: var(--muted);
      }

      .pageActions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }

      .pageActions select {
        width: auto;
        min-width: 140px;
      }

      .pageActions .seg2 {
        width: auto;
      }

      .selectionTools {
        display: none;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }

      .selectionTools.active {
        display: flex;
      }

      .selectToggle {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: #fffdf9;
        color: var(--muted);
        font-size: 12px;
      }

      .selectionMeta {
        color: var(--muted);
        font-size: 12px;
        font-family: var(--mono);
      }

      .accountsGrid {
        --cols: 3;
        display: grid;
        grid-template-columns: repeat(var(--cols), minmax(0, 1fr));
        gap: 12px;
      }

      @media (max-width: 1180px) {
        .accountsGrid { grid-template-columns: repeat(min(2, var(--cols)), minmax(0, 1fr)); }
      }

      @media (max-width: 760px) {
        .accountsGrid { grid-template-columns: 1fr; }
      }

      .accountCard {
        container-type: inline-size;
        position: relative;
        display: grid;
        gap: 10px;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: #fffdf9;
        box-shadow: var(--shadow);
        transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease, background-color 0.18s ease;
      }
      .accountCard:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow-lg);
      }
      .accountCard.selectable {
        cursor: pointer;
      }
      .accountCard.selectable::after {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 16px;

    <script>
      const $ = (id) => document.getElementById(id);

      function nowMs() { return Date.now(); }
      function fmtDate(tsMs) {
        const d = new Date(tsMs);
        return new Intl.DateTimeFormat('zh-CN', {
          year: 'numeric', month: '2-digit', day: '2-digit',
          hour: '2-digit', minute: '2-digit', second: '2-digit'
        }).format(d);
      }

      function fmtAgo(tsMs) {
        if (!tsMs) return '从未';
        const diff = Math.max(0, Date.now() - tsMs);
        const s = Math.floor(diff / 1000);
        const m = Math.floor(s / 60);
        const h = Math.floor(m / 60);
        const d = Math.floor(h / 24);
        const hh = h % 24;
        const mm = m % 60;
        if (d > 0) return `${d}d ${hh}h`;
        if (h > 0) return `${h}h ${mm}m`;
        if (m > 0) return `${m}m`;
        return `${s}s`;
      }

      function fmtBucketLabel(tsMs, bucketMs) {
        const opt = bucketMs >= 86400000
          ? { month: '2-digit', day: '2-digit' }
          : { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' };
        return new Intl.DateTimeFormat('zh-CN', opt).format(new Date(tsMs));
      }

      const NF = new Intl.NumberFormat('zh-CN', { maximumFractionDigits: 2 });
      function fmtNum(n) {
        const x = Number(n);
        if (!Number.isFinite(x)) return '';
        return NF.format(x);
      }

      function fmtCompactTokens(n) {
        const x = Number(n);
        if (!Number.isFinite(x)) return '0';
        if (Math.abs(x) >= 1000000) return `${(x / 1000000).toFixed(2)}M`;
        if (Math.abs(x) >= 1000) return `${(x / 1000).toFixed(1)}K`;
        return fmtNum(x);
      }

      function toast(msg) {
        const el = $('toast');
        el.textContent = msg;
        el.style.display = 'block';
        clearTimeout(el._t);
        el._t = setTimeout(() => { el.style.display = 'none'; }, 3200);
      }

      function setQuotaProgress(active, done, total, label) {
        const wrap = $('quotaProgressWrap');
        const bar = $('quotaProgressBar');
        const text = $('quotaProgressText');
        if (!wrap || !bar || !text) return;
        if (!active) {
          wrap.style.display = 'none';
          bar.style.width = '0%';
          text.textContent = '0/0';
          return;
        }
        const safeTotal = Math.max(0, Number(total) || 0);
        const safeDone = Math.max(0, Math.min(safeTotal || 0, Number(done) || 0));
        const pct = safeTotal > 0 ? Math.round((safeDone / safeTotal) * 100) : 0;
        wrap.style.display = 'grid';
        bar.style.width = `${pct}%`;
        text.textContent = label || `${safeDone}/${safeTotal} · ${pct}%`;
      }

      function modal({ title, body, actions, hideHeaderClose = false }) {
        $('modalTitle').textContent = title || '确认';
        $('modalClose').style.display = hideHeaderClose ? 'none' : '';
        $('modalBody').innerHTML = '';
        if (typeof body === 'string') {
          const p = document.createElement('div');
          p.textContent = body;
          $('modalBody').appendChild(p);
        } else if (body instanceof Node) {
          $('modalBody').appendChild(body);
        }

        $('modalFooter').innerHTML = '';
        (actions || []).forEach((a) => {
          const b = document.createElement('button');
          b.textContent = a.label;
          if (a.kind === 'primary') b.classList.add('primary');
          if (a.kind === 'danger') b.classList.add('danger');
          b.onclick = async () => {
            if (a.onClick) await a.onClick();
          };
          $('modalFooter').appendChild(b);
        });
        $('modal').style.display = 'grid';
      }
      function closeModal() { $('modal').style.display = 'none'; }

      $('modalClose').onclick = closeModal;
      $('modal').addEventListener('click', (e) => {
        if (e.target === $('modal')) closeModal();
      });

      function defaultBaseUrl() {
        const host = location.hostname || '127.0.0.1';
        const proto = location.protocol === 'https:' ? 'https:' : 'http:';
        return `${proto}//${host}:8317`;
      }

      const LS = {
        auto: 'cpa_panel_auto',
        alias: 'cpa_panel_alias_v1',
        columns: 'cpa_panel_columns_v1',
        pageSize: 'cpa_panel_page_size_v1',
        pageSizeCustom: 'cpa_panel_page_size_custom_v1',
        usageWindow: 'cpa_panel_usage_window_v1',
        sortBy: 'cpa_panel_sort_by_v1',
        sortDir: 'cpa_panel_sort_dir_v1',
        usageBlocks: 'cpa_panel_usage_blocks_v1',
        usagePricing: 'cpa_panel_usage_pricing_v1',
        statusGroups: 'cpa_panel_status_groups_v1',
        settingsCollapsed: 'cpa_panel_settings_collapsed_v1',
        usageCollapsed: 'cpa_panel_usage_collapsed_v1'
      };
      const SS = {
        adminKey: 'cpa_panel_admin_key_v1'
      };

      const STATUS_GROUP_KEYS = ['ready', 'rate', 'quota', 'disabled', 'bad'];

      const USAGE_BLOCK_DEFS = [
        ['totalRequests', '总请求数'],
        ['totalTokens', '总 Token 数'],
        ['rpm', 'RPM'],
        ['tpm', 'TPM'],
        ['totalCost', '总花费'],
        ['health', '服务健康监测'],
        ['curveCount', '曲线数量'],
        ['requestTrend', '请求趋势'],
        ['tokenTrend', 'Token 使用趋势'],
        ['tokenTypes', 'Token 类型分布'],
        ['costStats', '花费统计'],
        ['modelStats', '模型统计'],
        ['apiStats', 'API 详细统计'],
        ['requestEvents', '请求事件明细'],
      ];

      function loadAliases() {
        try {
          const raw = localStorage.getItem(LS.alias);
          return raw ? JSON.parse(raw) : {};

      async function apiFetch(path, opts = {}) {

      function normalizeAuthFileName(name) {
        if (!name) return '';
        if (name.endsWith('.json')) return name;
        return name + '.json';
      }

      function planFromName(name) {
        const n = (name || '').toLowerCase();
        if (n.includes('-team')) return 'Team';
        if (n.includes('-plus')) return 'Plus';
        if (n.includes('-pro')) return 'Pro';
        if (n.includes('-free')) return 'Free';

      }

      function isCodexName(name) {
        return (name || '').toLowerCase().startsWith('codex-');
      }

      function fmtDurMs(ms) {
        const s = Math.max(0, Math.floor(ms / 1000));
        const m = Math.floor(s / 60);
        const h = Math.floor(m / 60);
        const d = Math.floor(h / 24);
        const hh = h % 24;
        const mm = m % 60;
        const ss = s % 60;
        if (d > 0) return `${d}d ${hh}h`;
        if (h > 0) return `${h}h ${mm}m`;
        if (m > 0) return `${m}m ${ss}s`;
        return `${ss}s`;
      }

      function tryParseJson(s) {
        if (!s) return null;
        const t = String(s).trim();
        if (!t) return null;
        if (!(t.startsWith('{') || t.startsWith('['))) return null;
        try { return JSON.parse(t); } catch (_) { return null; }
      }

      function extractLimit(file) {
        const msg = (file && file.status_message != null) ? String(file.status_message).trim() : '';
        if (!msg) return null;

        // Common case: status_message is a JSON string: {"error":{...}}
        const obj = tryParseJson(msg);
        const err = obj && obj.error && typeof obj.error === 'object' ? obj.error : null;

        let type = '';
        let planType = '';
        let message = msg;
        let resetsAtSec = null;
        let resetsInSec = null;
        let promoMsg = '';

        if (err) {
          type = (err.type || err.code || '').toString();
          planType = (err.plan_type || err.planType || '').toString();
          message = (err.message || '').toString() || msg;
          const ra = Number(err.resets_at);
          if (Number.isFinite(ra)) resetsAtSec = ra;
          const ris = Number(err.resets_in_seconds);
          if (Number.isFinite(ris)) resetsInSec = ris;
          if (err.eligible_promo && typeof err.eligible_promo === 'object') {
            promoMsg = (err.eligible_promo.message || '').toString();
          }
        }

        const lower = msg.toLowerCase();
        let kind = null;

        if (type === 'usage_limit_reached' || lower.includes('usage_limit_reached')) kind = 'quota';
        else if (lower.includes('429') || lower.includes('rate') || type.includes('rate')) kind = 'rate';
        else if (lower.includes('context canceled') || lower.includes('timeout') || lower.includes('connection refused')) kind = 'network';

        if (!kind) return null;

        const now = Date.now();
        let resetsAtMs = null;
        if (resetsAtSec != null) resetsAtMs = resetsAtSec * 1000;
        else if (resetsInSec != null) resetsAtMs = now + resetsInSec * 1000;

        return {
          kind,
          type,
          planType,
          message,
          promoMsg,
          resetsAtMs,
          raw: obj
        };
      }

      const CODEX_QUOTA_URL = 'https://chatgpt.com/backend-api/wham/usage';
      const CODEX_QUOTA_BASE_HEADERS = {
        Authorization: 'Bearer $TOKEN$',
        'Content-Type': 'application/json',
        // Match the official panel's UA format.
        'User-Agent': 'codex_cli_rs/0.76.0 (Debian 13.0.0; x86_64) WindowsTerminal'
      };

      function authIndexOf(file) {
        const v = file && (file.auth_index ?? file.authIndex);
        return v == null ? '' : String(v);
      }

      function accountIdOf(file) {
        const v = file && (file.account_id ?? file.accountId);
        return v == null ? '' : String(v);
      }

      async function fetchAuthFileJson(name, signal) {
        const normalized = normalizeAuthFileName(name);
        if (!normalized) return null;
        if (state.authFileMetaByName.has(normalized)) return state.authFileMetaByName.get(normalized);
        const res = await apiFetch(`/v0/management/auth-files/download?name=${encodeURIComponent(normalized)}`, { signal });
        const text = await res.text();
        const obj = tryParseJson(text);
        if (!obj || typeof obj !== 'object') throw new Error(`凭证文件 ${normalized} 不是有效 JSON`);
        state.authFileMetaByName.set(normalized, obj);
        return obj;
      }

      async function resolveCodexFile(row, signal) {
        const file = row && row.file ? row.file : row;
        let authIndex = authIndexOf(file);
        let accountId = accountIdOf(file);
        if (authIndex !== '' && accountId) return file;

        const raw = await fetchAuthFileJson((row && row.rawName) || (file && file.name) || '', signal);
        if (raw && typeof raw === 'object') {
          if (file.auth_index == null && raw.auth_index != null) file.auth_index = raw.auth_index;
          if (file.authIndex == null && raw.authIndex != null) file.authIndex = raw.authIndex;
          if (file.account_id == null && raw.account_id != null) file.account_id = raw.account_id;
          if (file.accountId == null && raw.accountId != null) file.accountId = raw.accountId;
        }
        authIndex = authIndexOf(file);
        accountId = accountIdOf(file);
        if (authIndex === '') throw new Error('认证文件缺少 auth_index');
        if (!accountId) throw new Error('Codex 凭证缺少 ChatGPT 账号 ID');
        return file;
      }

      function normalizeResetAtMs(win) {
        if (!win || typeof win !== 'object') return null;
        const ra = Number(win.resets_at ?? win.reset_at ?? win.resetAt ?? win.resetsAt);
        if (Number.isFinite(ra) && ra > 0) return ra * 1000;
        const ris = Number(win.resets_in_seconds ?? win.resetsInSeconds ?? win.resetsIn);
        if (Number.isFinite(ris) && ris > 0) return Date.now() + ris * 1000;
        return null;
      }

      function normalizeQuotaWindow(win) {
        if (!win || typeof win !== 'object') return null;
        const usedPercentRaw = Number(win.used_percent ?? win.usedPercent);
        const usedRaw = Number(win.used ?? win.used_amount ?? win.usedAmount);
        const limitRaw = Number(win.limit ?? win.allowed ?? win.max ?? win.total ?? win.total_amount ?? win.totalAmount);
        const remainingRaw = Number(win.remaining ?? win.remaining_amount ?? win.remainingAmount);
        const limitWindowSecondsRaw = Number(win.limit_window_seconds ?? win.limitWindowSeconds);
        const resetAtMs = normalizeResetAtMs(win);

        const used = Number.isFinite(usedRaw) ? usedRaw : null;
        const limit = Number.isFinite(limitRaw) ? limitRaw : null;
        const remaining = Number.isFinite(remainingRaw) ? remainingRaw : null;
        const limitWindowSeconds = Number.isFinite(limitWindowSecondsRaw) ? limitWindowSecondsRaw : null;

        let usedPercent = null;
        if (Number.isFinite(usedPercentRaw)) usedPercent = Math.max(0, Math.min(100, usedPercentRaw));
        else if (limit != null && used != null && limit > 0) usedPercent = Math.max(0, Math.min(100, (used / limit) * 100));
        else if (limit != null && remaining != null && limit > 0) usedPercent = Math.max(0, Math.min(100, (1 - remaining / limit) * 100));

        return { usedPercent, used, limit, remaining, resetAtMs, limitWindowSeconds };
      }

      function unwrapQuotaPayload(value, depth = 0) {
        if (depth > 6 || value == null) return value;
        if (typeof value === 'string') {
          const parsed = tryParseJson(value);
          return parsed == null ? value : unwrapQuotaPayload(parsed, depth + 1);
        }
        if (typeof value !== 'object') return value;
        if (value.rate_limit || value.rateLimit || value.plan_type || value.planType) return value;

        const candidates = [
          value.body,
          value.body_text,
          value.bodyText,
          value.data,
          value.response,
          value.result,
          value.payload,
        ];
        for (const candidate of candidates) {
          if (candidate == null) continue;
          const unwrapped = unwrapQuotaPayload(candidate, depth + 1);
          if (unwrapped && typeof unwrapped === 'object' && (unwrapped.rate_limit || unwrapped.rateLimit || unwrapped.plan_type || unwrapped.planType)) {
            return unwrapped;
          }
        }
        return value;
      }

      function parseCodexQuota(bodyObj) {
        if (!bodyObj || typeof bodyObj !== 'object') return null;
        const planType = (bodyObj.plan_type ?? bodyObj.planType ?? '').toString();
        const rate = bodyObj.rate_limit ?? bodyObj.rateLimit ?? null;
        const primary = rate ? (rate.primary_window ?? rate.primaryWindow ?? null) : null;
        const secondary = rate ? (rate.secondary_window ?? rate.secondaryWindow ?? null) : null;
        const limitReached = rate ? !!(rate.limit_reached ?? rate.limitReached) : false;
        const allowed = rate ? (rate.allowed ?? null) : null;
        return {
          planType,
          allowed,
          limitReached,
          windows: {
            primary: normalizeQuotaWindow(primary),
            secondary: normalizeQuotaWindow(secondary)
          }
        };
      }

      async function fetchCodexQuota(file, signal) {
        const name = normalizeAuthFileName(file?.name || file?.id || '');
        if (!name) throw new Error('missing auth file name');
        const res = await apiFetch(`/quota?name=${encodeURIComponent(name)}`, { signal });
        const j = await res.json();
        const parsedPayload = unwrapQuotaPayload(j);
        const parsed = parseCodexQuota(parsedPayload);
        if (parsed) return parsed;

        const statusCode = Number(j?.status_code ?? j?.statusCode ?? j?.data?.status_code ?? j?.data?.statusCode ?? 0);
        const body = j?.body ?? j?.bodyText ?? j?.body_text ?? j?.data?.body ?? j?.data?.bodyText ?? j?.data?.body_text;

        if (!(statusCode >= 200 && statusCode < 300)) {
          const msg = (typeof body === 'string' && body.trim()) ? body.trim() : (j?.message ? String(j.message) : 'Request failed');
          throw new Error(`${statusCode || 'HTTP'} ${msg}`);
        }

        let obj = unwrapQuotaPayload(body);
        const parsed2 = parseCodexQuota(obj);
        if (!parsed2) throw new Error('额度数据解析失败');
        return parsed2;
      }

      function classify(file) {
        const disabled = !!file.disabled;
        const unavailable = !!file.unavailable;
        const status = (file.status || '').toLowerCase();
        const limit = extractLimit(file);
        const msg = (file && file.status_message != null) ? String(file.status_message).trim().toLowerCase() : '';
        const readyish = new Set(['', 'ready', 'ok', 'success', 'available', 'active', 'valid', 'enabled']);
        const badHints = ['invalid', 'expired', 'revoked', 'unauthorized', 'forbidden', 'failed', 'error', 'blocked'];
        if (disabled) return { key: 'disabled', label: '已停用', cls: 'bad' };
        if (limit && limit.kind === 'quota') return { key: 'quota', label: '额度用尽', cls: 'warn' };
        if (limit && limit.kind === 'rate') return { key: 'rate', label: '限流中', cls: 'warn' };
        if (unavailable) return { key: 'bad', label: '不可用', cls: 'bad' };
        if (readyish.has(status)) return { key: 'ready', label: '正常', cls: 'good' };
        if (badHints.some((s) => status.includes(s) || msg.includes(s))) return { key: 'bad', label: '异常', cls: 'bad' };
        return { key: 'ready', label: '正常', cls: 'good' };
      }

      function flattenUsage(usage) {
        const apis = (usage && usage.apis) || {};
        const out = [];
        for (const apiName of Object.keys(apis)) {
          const api = apis[apiName] || {};
          const models = api.models || {};
          for (const modelName of Object.keys(models)) {
            const m = models[modelName] || {};
            const details = Array.isArray(m.details) ? m.details : [];
            for (const d of details) {
              if (!d || !d.timestamp) continue;
              out.push({ apiName, modelName, ...d });
            }
          }
        }
        return out;
      }

      function computeStats(details, cutoffMs) {
        const byAuth = new Map();

        for (const d of details) {
          const idx = (d.auth_index ?? 'unknown').toString();
          const ts = new Date(d.timestamp).getTime();
          if (!Number.isFinite(ts)) continue;
          const tok = (d.tokens && (d.tokens.total_tokens ?? d.tokens.totalTokens)) || 0;
          const toks = getTokenBreakdown(d);
          const failed = !!d.failed;
          const src = (d.source || '').toString();
          const rawCost = getDetailCost(d);
          const computedCost = rawCost != null ? rawCost : getConfiguredCost(d, toks);

          let s = byAuth.get(idx);
          if (!s) {
            s = {
              source: src,
              lastUsed: 0,
              req: 0,
              tok: 0,
              fail: 0,
              cost: 0,
            };
            byAuth.set(idx, s);
          }
          s.lastUsed = Math.max(s.lastUsed, ts);
          if (cutoffMs != null && ts < cutoffMs) continue;
          s.req += 1;
          s.tok += tok;
          if (failed) s.fail += 1;
          if (computedCost != null) s.cost += computedCost;
        }

        return byAuth;
      }

      function groupUsageByAuth(details) {
        const byAuth = new Map();
        for (const d of details || []) {
          const idx = (d.auth_index ?? 'unknown').toString();
          const ts = new Date(d.timestamp).getTime();
          if (!Number.isFinite(ts)) continue;
          const tok = (d.tokens && (d.tokens.total_tokens ?? d.tokens.totalTokens)) || 0;
          let list = byAuth.get(idx);
          if (!list) {
            list = [];
            byAuth.set(idx, list);
          }
          list.push({ ts, tok });
        }
        return byAuth;
      }

      function latestUsageTsByAuth(details) {
        const map = new Map();
        for (const d of details || []) {
          const idx = (d.auth_index ?? '').toString();
          if (!idx) continue;
          const ts = new Date(d.timestamp).getTime();
          if (!Number.isFinite(ts)) continue;
          map.set(idx, Math.max(map.get(idx) || 0, ts));
        }
        return map;
      }

      function getTokenBreakdown(detail) {
        const t = (detail && detail.tokens) || {};
        const input = Number(t.input_tokens ?? t.inputTokens ?? 0) || 0;
        const output = Number(t.output_tokens ?? t.outputTokens ?? 0) || 0;
        const reasoning = Number(t.reasoning_tokens ?? t.reasoningTokens ?? 0) || 0;
        const cached = Number(t.cached_tokens ?? t.cachedTokens ?? 0) || 0;
        let total = Number(t.total_tokens ?? t.totalTokens ?? 0) || 0;
        if (!total) total = input + output + reasoning + cached;
        return { input, output, reasoning, cached, total };
      }

      function getDetailLatencyMs(detail) {
        const n = Number(detail?.latency_ms ?? detail?.latencyMs ?? detail?.latency);
        return Number.isFinite(n) ? n : null;
      }

      function getDetailCost(detail) {
        const keys = ['cost', 'cost_usd', 'costUsd', 'estimated_cost', 'estimatedCost', 'price'];
        for (const key of keys) {
          const n = Number(detail && detail[key]);
          if (Number.isFinite(n)) return n;
        }
        return null;
      }

      function getConfiguredCost(detail, tokens) {
        const modelName = String(detail?.modelName || detail?.model || '').toLowerCase();
        const prices = usagePricingState.map.get(modelName);
        if (!prices) return null;
        const billableInput = Math.max(0, (Number(tokens.input) || 0) - (Number(tokens.cached) || 0));
        const cachedInput = Math.max(0, Number(tokens.cached) || 0);
        const billableOutput = Math.max(0, Number(tokens.output) || 0);
        return (
          (billableInput / 1000000) * (Number.isFinite(prices.input) ? prices.input : 0) +
          (billableOutput / 1000000) * (Number.isFinite(prices.output) ? prices.output : 0) +
          (cachedInput / 1000000) * (Number.isFinite(prices.cached) ? prices.cached : 0)
        );
      }

      function getKnownModels() {
        const models = new Set();
        (state.usageDetails || []).forEach((d) => {
          const model = String(d?.modelName || d?.model || '').trim();
          if (model) models.add(model);
        });
        Object.keys(usagePricing || {}).forEach((model) => {
          if (model) models.add(model);
        });
        return Array.from(models).sort((a, b) => a.localeCompare(b, 'zh-CN'));
      }

      async function fetchModelCatalog() {
        const baseUrl = apiBase();
        try {
          const suffix = baseUrl ? `?baseUrl=${encodeURIComponent(baseUrl)}` : '';
          const res = await adminFetch(`/api/model-list${suffix}`, { cache: 'no-store' });
          const json = await res.json();
          const remote = Array.isArray(json?.models) ? json.models.map((x) => String(x).trim()).filter(Boolean) : [];
          const all = new Set([...remote, ...getKnownModels()]);
          return Array.from(all).sort((a, b) => a.localeCompare(b, 'zh-CN'));
        } catch (_) {
          return getKnownModels();
        }
      }

      async function toggleAuthEnabled(row, enabled) {
        const name = normalizeAuthFileName(row && row.rawName ? row.rawName : row?.file?.name || '');
        if (!name) throw new Error('missing auth file name');
        state.togglingAuthNames.add(name);
        render();
        try {
          const res = await adminFetch('/api/auth-toggle', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, disabled: !enabled })
          });
          await res.json().catch(() => ({}));
          if (row && row.file) row.file.disabled = !enabled;
          if (Array.isArray(state.files)) {
            const target = state.files.find((f) => normalizeAuthFileName(f?.name || '') === name);
            if (target) target.disabled = !enabled;
          }
          toast(enabled ? `已启用 ${name}` : `已停用 ${name}`);
        } finally {

          render();
        }

      function fmtMoney(v) {
        const n = Number(v);
        if (!Number.isFinite(n)) return '--';
        return `$${n.toFixed(n >= 100 ? 0 : n >= 10 ? 2 : 4)}`;
      }

      function fmtRate(v) {
        const n = Number(v);
        if (!Number.isFinite(n)) return '0';
        return n >= 100 ? fmtNum(Math.round(n)) : n.toFixed(2).replace(/\.00$/, '');
      }

      function pct(v) {
        const n = Number(v);
        if (!Number.isFinite(n)) return '--';
        return `${n.toFixed(1)}%`;
      }

      function groupUsageIntoBuckets(details, cfg) {
        const events = (details || []).filter((d) => d && d.__tsMs != null);
        if (!events.length) return [];
        const now = Date.now();
        const bucketMs = cfg.bucketMs || (24 * 3600 * 1000);
        const minTs = cfg.cutoffMs != null ? cfg.cutoffMs : Math.min(...events.map((d) => d.__tsMs));
        const maxTs = Math.max(now, ...events.map((d) => d.__tsMs));
        const start = Math.floor(minTs / bucketMs) * bucketMs;
        const end = Math.floor(maxTs / bucketMs) * bucketMs;
        const byBucket = new Map();
        for (let ts = start; ts <= end; ts += bucketMs) {
          byBucket.set(ts, { ts, req: 0, tok: 0 });
        }
        for (const d of events) {
          const key = Math.floor(d.__tsMs / bucketMs) * bucketMs;
          const bucket = byBucket.get(key) || { ts: key, req: 0, tok: 0 };
          const tok = getTokenBreakdown(d).total;
          bucket.req += 1;
          bucket.tok += tok;
          byBucket.set(key, bucket);
        }
        return Array.from(byBucket.values()).sort((a, b) => a.ts - b.ts);
      }

      function buildHealthBuckets(details, cfg) {
        const events = (details || []).filter((d) => d && d.__tsMs != null);
        if (!events.length) return [];
        const totalSlots = 48;
        const now = Date.now();
        const minTs = cfg.cutoffMs != null ? cfg.cutoffMs : Math.min(...events.map((d) => d.__tsMs));
        const spanMs = Math.max(1, (cfg.cutoffMs != null ? (now - cfg.cutoffMs) : (now - minTs)) || 1);
        const bucketMs = Math.max(5 * 60 * 1000, Math.ceil(spanMs / totalSlots));
        const start = Math.floor(minTs / bucketMs) * bucketMs;
        const end = Math.floor(now / bucketMs) * bucketMs;
        const byBucket = new Map();
        for (let ts = start; ts <= end; ts += bucketMs) {
          byBucket.set(ts, { ts, req: 0, fail: 0 });
        }
        for (const d of events) {
          const key = Math.floor(d.__tsMs / bucketMs) * bucketMs;
          const bucket = byBucket.get(key) || { ts: key, req: 0, fail: 0 };
          bucket.req += 1;
          bucket.fail += d.failed ? 1 : 0;
          byBucket.set(key, bucket);
        }
        return Array.from(byBucket.values()).sort((a, b) => a.ts - b.ts).slice(-totalSlots);
      }

      function buildUsageDashboard(filteredRows = null) {
        const cfg = getUsageWindowConfig();
        const allowedAuth = Array.isArray(filteredRows)
          ? new Set(filteredRows.map((r) => r.authIndex).filter((x) => x !== ''))
          : null;
        const raw = (state.usageDetails || []).map((d) => {
          const ts = new Date(d.timestamp).getTime();
          return Number.isFinite(ts) ? { ...d, __tsMs: ts } : null;
        }).filter(Boolean).filter((d) => {
          if (!allowedAuth || allowedAuth.size === 0) return true;
          return allowedAuth.has(String(d.auth_index ?? 'unknown'));
        });
        const details = raw.filter((d) => cfg.cutoffMs == null || d.__tsMs >= cfg.cutoffMs);
        const sorted = details.slice().sort((a, b) => b.__tsMs - a.__tsMs);

        let totalReq = 0;
        let totalTok = 0;
        let totalCost = 0;
        let hasCost = false;
        let totalFail = 0;
        let latencyTotal = 0;
        let latencyCount = 0;
        const tokenTypes = { input: 0, output: 0, reasoning: 0, cached: 0 };
        const byModel = new Map();
        const byApi = new Map();

        for (const d of details) {
          const toks = getTokenBreakdown(d);
          const latency = getDetailLatencyMs(d);
          const cost = getDetailCost(d);
          const computedCost = cost != null ? cost : getConfiguredCost(d, toks);
          const failed = !!d.failed;
          const model = String(d.modelName || d.model || 'unknown');
          const api = String(d.apiName || 'default');
          const source = String(d.source || 'unknown');
          const apiKey = `${api} / ${source}`;

          totalReq += 1;
          totalTok += toks.total;
          totalFail += failed ? 1 : 0;
          tokenTypes.input += toks.input;
          tokenTypes.output += toks.output;
          tokenTypes.reasoning += toks.reasoning;
          tokenTypes.cached += toks.cached;
          if (latency != null) {
            latencyTotal += latency;
            latencyCount += 1;
          }
          if (computedCost != null) {
            totalCost += computedCost;
            hasCost = true;
          }

          const m = byModel.get(model) || { name: model, req: 0, tok: 0, fail: 0, cost: 0, hasCost: false };
          m.req += 1;
          m.tok += toks.total;
          m.fail += failed ? 1 : 0;
          if (computedCost != null) { m.cost += computedCost; m.hasCost = true; }
          byModel.set(model, m);

          const a = byApi.get(apiKey) || { name: apiKey, api, source, req: 0, tok: 0, fail: 0, cost: 0, hasCost: false };
          a.req += 1;
          a.tok += toks.total;
          a.fail += failed ? 1 : 0;
          if (computedCost != null) { a.cost += computedCost; a.hasCost = true; }
          byApi.set(apiKey, a);
        }

        const trend = groupUsageIntoBuckets(details, cfg);
        const healthBuckets = buildHealthBuckets(details, cfg);
        const curveCount = trend.length;
        const reqVals = trend.map((x) => x.req);
        const tokVals = trend.map((x) => x.tok);

        let spanMinutes = 1;
        if (cfg.spanMs != null) spanMinutes = Math.max(1, cfg.spanMs / 60000);
        else if (details.length > 1) spanMinutes = Math.max(1, (details[0].__tsMs - details[details.length - 1].__tsMs) / 60000);

        const avgLatency = latencyCount ? latencyTotal / latencyCount : null;
        const successRate = totalReq ? ((totalReq - totalFail) / totalReq) * 100 : null;
        const errorRate = totalReq ? (totalFail / totalReq) * 100 : null;
        const rpm = totalReq / spanMinutes;
        const tpm = totalTok / spanMinutes;

        return {
          cfg,
          totalReq,
          totalTok,
          totalCost,
          hasCost,
          costSource: hasCost ? (details.some((d) => getDetailCost(d) != null) ? 'usage' : 'configured') : 'none',
          totalFail,
          rpm,
          tpm,
          avgLatency,
          successRate,
          errorRate,
          curveCount,
          trend,
          healthBuckets,
          reqVals,
          tokVals,
          tokenTypes,
          modelStats: Array.from(byModel.values()).sort((a, b) => b.req - a.req || b.tok - a.tok).slice(0, 12),
          apiStats: Array.from(byApi.values()).sort((a, b) => b.req - a.req || b.tok - a.tok).slice(0, 12),
          events: sorted.slice(0, 50),
        };
      }

      function sumTokensInQuotaWindow(events, resetAtMs, limitWindowSeconds) {
        if (!Array.isArray(events) || !events.length) return 0;
        if (!resetAtMs || !limitWindowSeconds) return 0;
        const fromMs = resetAtMs - (limitWindowSeconds * 1000);
        const toMs = Math.min(Date.now(), resetAtMs);
        let total = 0;
        for (const ev of events) {
          if (ev.ts >= fromMs && ev.ts <= toMs) total += Number(ev.tok) || 0;
        }
        return total;
      }

      let state = {
        files: [],

        usageByAuth: new Map(),
        quotaByAuthIndex: new Map(),
        authFileMetaByName: new Map(),
        lastLoadAt: 0,
        loadError: '',
        page: 1,
        selectedKeys: new Set(),
        selectionMode: false,
        togglingAuthNames: new Set(),

        loadingUsage: false,

      };

      }

        const v = $('pageSize').value;
        if (v === 'custom') {
          const custom = parseInt(($('pageSizeCustom').value || '').trim(), 10);
          return Number.isFinite(custom) && custom > 0 ? custom : 20;
        }

      }

      function getUsageWindowConfig() {
        const key = $('usageWindow').value || '7h';
        const now = Date.now();
        const map = {
          '7h': { key: '7h', label: '7h', cutoffMs: now - 7 * 3600 * 1000, spanMs: 7 * 3600 * 1000, bucketMs: 30 * 60 * 1000 },
          '1d': { key: '1d', label: '一天', cutoffMs: now - 24 * 3600 * 1000, spanMs: 24 * 3600 * 1000, bucketMs: 2 * 3600 * 1000 },
          '1w': { key: '1w', label: '一周', cutoffMs: now - 7 * 24 * 3600 * 1000, spanMs: 7 * 24 * 3600 * 1000, bucketMs: 24 * 3600 * 1000 },
          '1m': { key: '1m', label: '一月', cutoffMs: now - 30 * 24 * 3600 * 1000, spanMs: 30 * 24 * 3600 * 1000, bucketMs: 3 * 24 * 3600 * 1000 },
          'all': { key: 'all', label: '全部', cutoffMs: null, spanMs: null, bucketMs: 7 * 24 * 3600 * 1000 },
        };
        return map[key] || map['7h'];
      }

      function parseMaybeTimeMs(v) {
        if (v == null || v === '') return null;
        if (typeof v === 'number' && Number.isFinite(v)) return v > 1e12 ? v : v * 1000;
        const n = Number(v);
        if (Number.isFinite(n) && String(v).trim() !== '') return n > 1e12 ? n : n * 1000;
        const t = new Date(v).getTime();
        return Number.isFinite(t) ? t : null;
      }

      function addedAtOf(file) {
        if (!file || typeof file !== 'object') return null;
        const candidates = [
          file.created_at, file.createdAt,
          file.added_at, file.addedAt,
          file.updated_at, file.updatedAt,
          file.file_mtime, file.fileMtime,
          file.mtime, file.modified_at, file.modifiedAt,
          file.last_modified, file.lastModified,
        ];
        for (const c of candidates) {
          const ms = parseMaybeTimeMs(c);
          if (ms != null) return ms;
        }
        return null;
      }

      function rowSelectionKey(row) {
        if (!row) return '';
        if (row.authIndex !== '') return `auth:${row.authIndex}`;
        if (row.id) return `id:${row.id}`;
        return `name:${row.rawName || ''}`;
      }

      function isRowSelected(row) {

      }

      function setRowSelected(row, selected) {
        const key = rowSelectionKey(row);
        if (!key) return;
        if (selected) state.selectedKeys.add(key);
        else state.selectedKeys.delete(key);
      }

      function matchesFilters(row) {

        if (selectedStatusGroups.size === 0) return false;
        if (!selectedStatusGroups.has(row.statusKey)) return false;

          const hay = `${row.displayName} ${row.rawName} ${row.email} ${row.statusText} ${row.statusMsg}`.toLowerCase();

      function mkNameCell(row) {

      function mkUsageBars(row) {
        const root = document.createElement('div');
        root.className = 'bars';

        const make = (lbl, req, tok, cap, pctOverride, note, pctLabel, fillClass = '') => {
          const bar = document.createElement('div');
          bar.className = 'bar';
          const l = document.createElement('div');
          l.className = 'lbl';
          l.textContent = lbl;
          bar.appendChild(l);

          const box = document.createElement('div');
          const track = document.createElement('div');
          track.className = 'track';
          const fill = document.createElement('div');
          fill.className = `fill ${fillClass}`.trim();
          let pct = 0;
          if (typeof pctOverride === 'number') pct = Math.max(0, Math.min(100, Math.round(pctOverride)));
          else if (cap && cap > 0) pct = Math.max(0, Math.min(100, Math.round((req / cap) * 100)));
          else if (req === 0 && tok === 0) pct = 0;
          fill.style.width = pct + '%';
          track.appendChild(fill);
          box.appendChild(track);
          const t = document.createElement('div');
          t.className = 'txt';
          if (typeof pctOverride === 'number' || (req === 0 && tok === 0)) {
            t.textContent = `${pct}%${pctLabel ? ` ${pctLabel}` : ''}${note ? ` · ${note}` : ''}`;
          } else {
            t.textContent = cap ? `${fmtNum(req)}/${fmtNum(cap)} req, ${fmtCompactTokens(tok)} tok` : `${fmtNum(req)} req, ${fmtCompactTokens(tok)} tok`;
          }
          box.appendChild(t);

          bar.appendChild(box);
          return bar;
        };

        const hasQuota = (row.showQuota5h && row.quota5hPct != null) || (row.quotaWkPct != null);

        const quotaNote = (used, limit, resetAtMs, usedTokApprox) => {
          const parts = [];
          if (used != null && limit != null) parts.push(`${fmtNum(used)}/${fmtNum(limit)}`);
          if (usedTokApprox != null) parts.push(`已用 ${fmtCompactTokens(usedTokApprox)} tok`);
          if (resetAtMs) parts.push(`重置 ${fmtDate(resetAtMs)}`);
          return parts.join(' · ') || '现在';
        };

        if (hasQuota) {
          if (row.showQuota5h) {
            root.appendChild(make(
              '5h',
              0,
              0,
              null,
              row.quota5hPct != null ? Math.max(0, 100 - row.quota5hPct) : null,
              quotaNote(row.quota5hUsed, row.quota5hLimit, row.quota5hResetAtMs, row.quota5hUsedTokApprox),
              '剩余',
              (row.quota5hPct != null ? Math.max(0, 100 - row.quota5hPct) : 0) < 50 ? 'quotaYellow' : 'quotaGreen'
            ));
          }
          root.appendChild(make(
            '周',
            0,
            0,
            null,
            row.quotaWkPct != null ? Math.max(0, 100 - row.quotaWkPct) : null,
            quotaNote(row.quotaWkUsed, row.quotaWkLimit, row.quotaWkResetAtMs, row.quotaWkUsedTokApprox),
            '剩余',
            (row.quotaWkPct != null ? Math.max(0, 100 - row.quotaWkPct) : 0) < 50 ? 'quotaYellow' : 'quotaGreen'
          ));
          return root;
        }

        const note = row.cooldownRemainingMs != null ? `${fmtDurMs(row.cooldownRemainingMs)} 自动恢复` : row.windowLabel;
        const pct = (row.statusKey === 'rate' || row.statusKey === 'quota') ? 0 : null;
        root.appendChild(make(row.windowLabel, row.windowReq, row.windowTok, null, pct, pct != null ? note : row.windowLabel, pct != null ? '剩余' : ''));
        return root;

      function collectStatusLines(r) {
        const extraLines = [];
        if ((r.statusKey === 'quota' || r.statusKey === 'rate') && !r.scheduleAllowed) {
          if (r.cooldownRemainingMs != null && r.cooldownUntilMs != null) {
            extraLines.push(`${fmtDurMs(r.cooldownRemainingMs)} 自动恢复`);
          } else {
            extraLines.push('当前不参与调度');
          }
        }
        if (r.quotaError) extraLines.push(`额度查询失败：${r.quotaError}`);
        if ((r.statusKey === 'bad' || r.statusKey === 'disabled') && (r.limitType || r.limitMessage)) {
          const t = [r.limitType, r.limitMessage].filter(Boolean).join(': ');
          if (t) extraLines.push(t);
          if (r.limitPromoMsg) extraLines.push(r.limitPromoMsg);
        } else if ((r.statusKey === 'bad' || r.statusKey === 'disabled') && r.statusMsg) {
          const t = String(r.statusMsg);
          extraLines.push(t.length > 180 ? t.slice(0, 180) + '...' : t);
        }
        return extraLines;
      }

      function mkSection(title, content) {

      function mkUsageSection(row) {
        const box = document.createElement('div');
        box.style.display = 'grid';
        box.style.gap = '8px';
        box.appendChild(mkUsageBars(row));
        if (!row.hasQuotaData && !row.quotaLoading) {

        }
